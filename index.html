/* ===== Meal prep ===== */
var UNITS=[{v:'g',t:'gramos (g)'},{v:'ml',t:'mililitros (ml)'},{v:'ud',t:'unidades'}];
function M(){return S.meal;}
function ingOf(id){return M().ings.filter(function(x){return x.id===id;})[0]||null;}
function ingByName(n){var k=norm(n);return M().ings.filter(function(x){return norm(x.name)===k;})[0]||null;}
function recOf(id){return M().recipes.filter(function(x){return x.id===id;})[0]||null;}
function latestByStore(ing){var by={};(ing.prices||[]).forEach(function(p){if(!by[p.store]||p.date>by[p.store].date)by[p.store]=p;});return by;}
function unitPrice(ing,mode,store){
  var by=latestByStore(ing),ps=Object.keys(by).map(function(k){return by[k];});if(!ps.length)return null;
  mode=mode||M().cfg.mode;store=store||M().cfg.store;
  if(mode==='pref'&&ing.pref&&by[ing.pref])return {u:by[ing.pref].price/by[ing.pref].qty,p:by[ing.pref]};
  if(mode==='store'&&store&&by[store])return {u:by[store].price/by[store].qty,p:by[store]};
  if(mode==='last'){var l=ps.slice().sort(function(a,b){return a.date<b.date?1:-1;})[0];return {u:l.price/l.qty,p:l};}
  var m=ps.slice().sort(function(a,b){return a.price/a.qty-b.price/b.qty;})[0];return {u:m.price/m.qty,p:m};
}
function fmtUnitPrice(ing,u){return ing.unit==='ud'?money(u)+'/ud':money(u*1000)+(ing.unit==='g'?'/kg':'/l');}
function fmtQty(q,unit){q=Math.round(q*100)/100;if(unit==='g'&&q>=1000)return String(Math.round(q/10)/100).replace('.',',')+' kg';if(unit==='ml'&&q>=1000)return String(Math.round(q/10)/100).replace('.',',')+' l';return String(q).replace('.',',')+(unit==='ud'?' ud':' '+unit);}
function recipeCost(r){
  var tot=0,missing=[],lines=[];
  (r.items||[]).forEach(function(it){var ing=ingOf(it.ing);if(!ing)return;var up=unitPrice(ing);if(!up){missing.push(ing.name);lines.push({ing:ing,qty:it.qty,cost:null});return;}var c=up.u*it.qty;tot+=c;lines.push({ing:ing,qty:it.qty,cost:c,store:up.p.store});});
  var sv=r.servings||1;return {total:r2(tot),per:r2(tot/sv),missing:missing,lines:lines};
}
function batchLeft(b){return b.servings-M().logs.filter(function(l){return l.batch===b.id;}).length;}
function mealOf(r){return r&&r.meal==='desayuno'?'desayuno':'almuerzo';}
function batchOf(id){return M().batches.filter(function(x){return x.id===id;})[0]||null;}
function batchMeal(b){return b?mealOf(recOf(b.recipe)):'almuerzo';}
function refOf(t){var c=M().cfg;return t==='desayuno'?(c.refB!=null?c.refB:5):(c.ref||0);}
function targetOf(t){var c=M().cfg;return t==='desayuno'?(c.targetB!=null?c.targetB:3):(c.target||0);}
function hasBreakfast(){return M().recipes.some(function(r){return r.mp&&mealOf(r)==='desayuno';})||M().logs.some(function(l){return batchMeal(batchOf(l.batch))==='desayuno';});}
function activeBatch(type){type=type||'almuerzo';return M().batches.filter(function(b){return batchLeft(b)>0&&batchMeal(b)===type;}).sort(function(a,b){return a.date<b.date?-1:1;})[0]||null;}
function logOn(date,type){type=type||'almuerzo';return M().logs.filter(function(l){return l.date===date&&batchMeal(batchOf(l.batch))===type;})[0]||null;}
function mealCount(x){return x.nD?x.nA+(x.nA===1?' almuerzo':' almuerzos')+' y '+x.nD+(x.nD===1?' desayuno':' desayunos'):x.n+(x.n===1?' almuerzo':' almuerzos');}
function mealSaving(fromDate,toDate){
  var n=0,save=0,cost=0,tgt=0,nA=0,nD=0;
  M().logs.forEach(function(l){if(fromDate&&l.date<fromDate)return;if(toDate&&l.date>toDate)return;var b=batchOf(l.batch);if(!b)return;var t=batchMeal(b);n++;if(t==='desayuno')nD++;else nA++;cost+=b.per;tgt+=targetOf(t);save+=refOf(t)-b.per;});
  return {n:n,nA:nA,nD:nD,save:r2(save),cost:r2(cost),tgt:r2(tgt)};
}
function mealSection(date){
  var rows='',types=[];
  ['almuerzo','desayuno'].forEach(function(t){
    var lg=logOn(date,t),ab=activeBatch(t);if(!lg&&!ab)return;types.push(t);
    var verb=t==='desayuno'?'Desayuné':'Comí',q=t==='desayuno'?'¿Desayunaste meal prep?':'¿Comiste meal prep?';
    if(lg){var b=batchOf(lg.batch),r=b?recOf(b.recipe):null;
      rows+='<li class="row"><button class="check on" data-act="meal-log" data-d="'+date+'" data-t="'+t+'" aria-label="Desmarcar '+t+' de meal prep"></button><span class="rowmain"><span class="t">'+verb+' meal prep'+(r?': '+esc(r.name):'')+'</span><span class="sub">Ahorro '+money(refOf(t)-(b?b.per:0))+' frente a comer fuera</span></span></li>';}
    else{var r2_=recOf(ab.recipe);rows+='<li class="row"><button class="check" data-act="meal-log" data-d="'+date+'" data-t="'+t+'" aria-label="Marcar '+t+' de meal prep"></button><span class="rowmain"><span class="t">'+q+'</span><span class="sub">'+esc(r2_?r2_.name:'Tanda')+' · quedan '+batchLeft(ab)+' raciones</span></span></li>';}
  });
  if(!types.length)return '';
  var head=types.length===2?'Desayuno y almuerzo':(types[0]==='desayuno'?'Desayuno':'Almuerzo');
  return '<section class="sect"><h2>'+head+'<button class="link" data-act="go-meal">Meal prep</button></h2><ul class="rows">'+rows+'</ul></section>';
}

    '<button class="btn primary block" data-act="recipe-new">Nueva receta</button></section>';

function viewRecipe(r){

function copyText(txt){

}

var VIEWS={hoy:viewHoy,tareas:viewTareas,compras:viewComprasTab,habitos:viewHabitos,fin:viewFin,mas:viewMas};
var elHead=document.getElementById('head'),elMain=document.getElementById('main'),elNav=document.getElementById('nav'),elSheet=document.getElementById('sheet');

/* Botón atrás del móvil: cada pantalla queda en el historial del navegador */
var NAV_KEYS=['tab','ftab','goal','recipe','mealSub','shopTab','taskTab','hist','fday','fcat','fall','view','review'],NAV_ALL=NAV_KEYS.concat(['fmonth','date','fhl']);
var navLast='',navReady=false,navRestoring=false,navExitAt=0,navSheetSkip=false;
function navSnap(keys){var o={};keys.forEach(function(k){o[k]=ui[k];});return o;}
function navKey(){return JSON.stringify(navSnap(NAV_KEYS));}
function navSync(){
  if(!navReady||navRestoring||!window.history||!history.pushState)return;
  var k=navKey();if(k===navLast)return;
  try{history.pushState({mi:1,s:navSnap(NAV_ALL)},'');}catch(e){}
  navLast=k;
}
function navInit(){
  if(!window.history||!history.pushState)return;
  try{history.replaceState({mi:1,root:1,s:navSnap(NAV_ALL)},'');history.pushState({mi:1,s:navSnap(NAV_ALL)},'');}catch(e){}
  navLast=navKey();navReady=true;
  window.addEventListener('popstate',function(e){
    var st=e.state||{};
    if(ui.sheet||news){if(news){news=null;S.seenV=APP_VERSION;save();}if(ui.sheet)closeSheet(true);else renderSheet();try{history.pushState({mi:1,s:navSnap(NAV_ALL)},'');}catch(x){}return;}
    if(navSheetSkip){navSheetSkip=false;return;}
    if(ui.sel){ui.sel=null;render();try{history.pushState({mi:1,s:navSnap(NAV_ALL)},'');}catch(x){}return;}
    if(st.root){
      if(Date.now()-navExitAt<2500){history.back();return;}
      navExitAt=Date.now();ui.msg='Pulsa atrás otra vez para salir de la app.';
      try{history.pushState({mi:1,s:navSnap(NAV_ALL)},'');}catch(x){}
      render();return;
    }
    if(st.s){navRestoring=true;ui.sel=null;Object.keys(st.s).forEach(function(k){ui[k]=st.s[k];});ui.confirm='';render();elMain.scrollTop=0;navRestoring=false;navLast=navKey();}
  });
}
function render(){

  elHead.innerHTML='<p class="eyebrow">'+(ui.tab==='hoy'?fmtDate(todayStr()):'Mi Día')+(DEMO?' <span class="demotag">DEMO</span>':'')+'</p><h1>'+title+'</h1>';
  var top='';

    return '<button data-act="tab" data-tab="'+k+'"'+(k===ui.tab?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k]+'</svg>'+TITLES[k]+'</button>';
  }).join('');
  window.__render=render;

      if((o.g||'')!==lastG){if(lastG)oh+='</optgroup>';if(o.g)oh+='<optgroup label="'+esc(o.g)+'">';lastG=o.g||'';}

  }

function openListSheet(l){

/* ---------- Acciones ---------- */
function find(arr,id){return arr.filter(function(x){return x.id===id;})[0];}
function openItemSheet(id){
  var L=null,it=null;S.lists.forEach(function(l){var x=find(l.items,id);if(x){L=l;it=x;}});
  if(!it)return;
  openSheet({title:'Editar elemento',values:{text:it.text,list:L.id},
    fieldsFn:function(v){var f=[{id:'text',label:'Texto',value:v.text,required:true}];
      if(S.lists.length>1)f.push({id:'list',label:'Lista',type:'select',value:v.list,options:S.lists.map(function(l){return {v:l.id,t:l.name};})});
      return f;},
    onSave:function(v){
      var t=String(v.text).replace(/\|/g,'/').trim();if(t)it.text=t;
      if(v.list&&v.list!==L.id){var NL=find(S.lists,v.list);if(NL){L.items=L.items.filter(function(x){return x!==it;});NL.items.push(it);}}
    },
    onDelete:function(){L.items=L.items.filter(function(x){return x!==it;});}});
}
function addItem(L,text,noFreq){
  text=text.replace(/\|/g,'/').trim();if(!text)return;
  L.items.push({id:uid(),text:text,done:false});
  if(noFreq)return;
  L.freq=L.freq||{};L.freq[text]=(L.freq[text]||0)+1;
}
function openDotSheet(h,date){
  var v=logv(h.id,date);
  openSheet({title:h.name+' · '+fmtDate(date),values:{v:String(v),q:v>0?'si':'no'},
    fieldsFn:function(vv){
      var f=h.type==='reduce'?[{id:'v',label:'Cuántas veces este día ('+limitTxt(h)+(isWeekly(h)?'; esa semana: '+weekSumTo(h,date):'')+')',value:vv.v,inputmode:'numeric'}]
        :[{id:'q',label:'¿Hubo una recaída este día?',type:'select',value:vv.q,options:[{v:'no',t:'No'},{v:'si',t:'Sí'}]}];
      f.push({type:'button',id:'gd',label:'Ver el día completo',act:'goto-day-id',data:date});return f;},
    onSave:function(vv){
      var nv=h.type==='reduce'?Math.max(0,parseInt(vv.v,10)||0):(vv.q==='si'?1:0);
      if(nv>0&&h.type!=='quit'&&diff(date,h.created)<0)h.created=date;
      setLog(h.id,date,nv);
    }});
}
function habitDayAct(a,id,date){
  var h=find(S.habits,id);if(!h)return;
  var v=logv(id,date),nv;
  if(a==='hd-do'||a==='hd-slip')nv=v?0:1;else if(a==='hd-plus')nv=v+1;else nv=Math.max(0,v-1);
  if(nv>0&&h.type!=='quit'&&diff(date,h.created)<0)h.created=date;
  setLog(id,date,nv);
}
function setChoreHist(c,mutate){
  c.hist=c.hist||[];mutate(c.hist);c.hist.sort();
  c.last=c.hist.length?c.hist[c.hist.length-1]:null;save();
}

    case 'demo-off':try{localStorage.removeItem('mi-dia-mode');}catch(e){}location.reload();return;
    case 'demo-reset':if(ui.confirm!=='demo-reset'){ui.confirm='demo-reset';break;}try{localStorage.removeItem(KEY);localStorage.removeItem(DRAFT_KEY);}catch(e){}location.reload();return;
    case 'demo-keep':S.demo=false;ui.msg='Listo: no volverá a aparecer el aviso.';save();break;
    case 'reset':
      if(ui.confirm!=='reset'){ui.confirm='reset';break;}
      S=blank();save();ui.confirm='';ui.listId=null;ui.tab='hoy';ui.view='dia';ui.date=T;break;
  }
  render();
}
function bkDue(){
  if(DEMO||!S.prefs)return null;
  var p=S.prefs,ev=p.bkEvery==null?30:+p.bkEvery;if(!ev)return null;
  var base=p.bkLast||p.bkSince||'';if(!base)return null;
  var T=todayStr(),n=diff(T,base);if(n<ev)return null;
  if(p.bkSnooze&&p.bkSnooze>T)return null;
  return n;
}
function markBackup(msg){S.prefs.bkLast=todayStr();S.prefs.bkSnooze='';save();ui.msg=msg;render();}
function shareBackup(){
  var name='mi-dia-copia-'+todayStr()+'.json',data=JSON.stringify(S);
  try{
    var f=new File([data],name,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:'Copia de seguridad de Mi Día',text:'Copia de seguridad de Mi Día del '+todayStr()}).then(function(){markBackup('Copia compartida. Comprueba que ha llegado a tu correo.');}).catch(function(e){if(e&&e.name==='AbortError')return;downloadBackup();});
      return;
    }
  }catch(e){}
  downloadBackup();
}
function downloadBackup(){
  try{
    var data=JSON.stringify(S),blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='mi-dia-copia-'+todayStr()+'.json';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    S.prefs.bkLast=todayStr();S.prefs.bkSnooze='';save();
    ui.msg='Copia descargada. Guárdala en un sitio privado o envíatela por correo.';
  }catch(e){ui.msg='No se pudo descargar. Usa «Generar copia» y copia el texto.';}
  render();
}

}

var lpTimer=null,lpStart=null,lpFired=false;

  lpFired=false;
  var b=e.target.closest&&e.target.closest('[data-act="tx-edit"]');if(!b||ui.ftab!=='mov'||ui.tab!=='fin')return;
  lpStart={x:e.clientX,y:e.clientY};lpFired=false;clearTimeout(lpTimer);
  lpTimer=setTimeout(function(){lpFired=true;ui.sel={};ui.sel[b.dataset.id]=true;if(navigator.vibrate)try{navigator.vibrate(15);}catch(x){}render();},550);
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){document.addEventListener(ev,function(){clearTimeout(lpTimer);lpStart=null;if(lpFired&&ev==='pointerup')setTimeout(function(){lpFired=false;},350);});});
document.addEventListener('pointermove',function(e){if(lpStart&&(Math.abs(e.clientX-lpStart.x)>10||Math.abs(e.clientY-lpStart.y)>10))clearTimeout(lpTimer);});

document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.closest('form');if(!f)return;
  var kind=f.dataset.form;
  if(kind==='sheet'){
    var vals=collect(),res=ui.sheet.onSave(vals);
    if(typeof res==='string'){ui.sheet.values=Object.assign({},ui.sheet.values,vals);ui.sheet.error=res;renderSheet();return;}
    if(ui.sheet&&ui.sheet.keep){ui.sheet.keep=false;save();render();return;}
    closeSheet();save();render();
  }else if(kind==='task-add'){
    var ti=document.getElementById('new-task'),du=document.getElementById('new-task-due');
    if(ti.value.trim()){S.tasks.push({id:uid(),title:ti.value.trim(),due:du.value,area:'',done:false});save();ui.focus='#new-task';render();}
  }else if(kind==='item-add'){
    var L=curList(),it=document.getElementById('new-item');
    if(L&&it.value.trim()){addItem(L,it.value);save();ui.focus='#new-item';render();}
  }else if(kind==='q-apply'){
    var gi=+f.dataset.gi,g=queueGroups()[gi];
    if(g){
      var qt=f.querySelector('[name=text]').value,qv=f.querySelector('[name=cat]').value,qs=f.querySelector('[name=sim]').checked;
      var qm=f.querySelector('[name=mode]');
      if(qm&&qm.value==='sel'&&qv){
        var ids={};[].forEach.call(f.querySelectorAll('[name=sel]:checked'),function(x){ids[x.value]=1;});
        var qp2=splitCat(qv),nsel=0;S.fin.txns.forEach(function(t){if(ids[t.id]){t.man=true;t.cat=qp2[0];t.sub=qp2[1];nsel++;}});
        ui.msg=nsel?nsel+(nsel===1?' movimiento clasificado':' movimientos clasificados')+' sin crear regla.':'No había ningún movimiento marcado.';save();render();
      }else if(qt.trim()&&qv){var qp=splitCat(qv);addRule(qt,qp[0],qp[1],qs?Math.round(median(g.items.map(function(t){return Math.abs(t.a);}))*100)/100:null);render();}
    }
  }else if(kind==='prio-add'){
    var pi=document.getElementById('new-prio');if(pi&&pi.value.trim()){S.tasks.push({id:uid(),title:pi.value.trim(),due:'',area:'',done:false,star:true});save();ui.focus='#new-prio';render();}
  }else if(kind==='conc'){
    var pc=(S.fin.pend||[]).filter(function(x){return x.id===f.dataset.id;})[0],sel=f.querySelector('[name=m]:checked');
    if(pc&&sel){var tc=S.fin.txns.filter(function(x){return x.id===sel.value;})[0];if(tc){applyPend(pc,tc);ui.msg='Conciliado con '+txTitle(tc)+'.';save();render();}}
  }else if(kind==='demo-clean'){
    var rm={habits:{},tasks:{},chores:{},items:{}},nr=0;
    [].forEach.call(f.querySelectorAll('[name=sel]:checked'),function(x){var pp=x.value.split('|');rm[pp[0]][pp[1]]=1;nr++;});
    S.habits=S.habits.filter(function(h){return !rm.habits[h.id];});
    Object.keys(S.log).forEach(function(dd){Object.keys(rm.habits).forEach(function(id){if(S.log[dd])delete S.log[dd][id];});if(S.log[dd]&&!Object.keys(S.log[dd]).length)delete S.log[dd];});
    S.tasks=S.tasks.filter(function(t){return !rm.tasks[t.id];});
    S.chores=S.chores.filter(function(c){return !rm.chores[c.id];});
    S.lists.forEach(function(l){l.items=l.items.filter(function(i){return !rm.items[i.id];});});
    S.demo=false;ui.msg=nr?nr+(nr===1?' elemento de ejemplo quitado.':' elementos de ejemplo quitados.'):'No se quitó nada. El aviso ya no aparecerá.';save();render();
  }else if(kind==='trip-review'){
    var gr=goalOf(f.dataset.id);
    if(gr){var on={},nA=0;[].forEach.call(f.querySelectorAll('[name=sel]'),function(x){on[x.value]=x.checked;});
      S.fin.txns.forEach(function(t){if(!(t.id in on))return;if(on[t.id]){t.goal=gr.id;nA++;}else{t.gno=(t.gno||[]).concat([gr.id]);}});
      ui.msg=nA+(nA===1?' gasto asignado':' gastos asignados')+' a '+gr.name+'.';save();render();}
  }else if(kind==='gtask-add'){
    var gt=goalOf(f.dataset.id),ti2=document.getElementById('new-gtask'),du2=document.getElementById('new-gtask-due');
    if(gt&&ti2.value.trim()){S.tasks.push({id:uid(),title:ti2.value.trim(),due:du2.value,area:gt.name,goal:gt.id,done:false});save();ui.focus='#new-gtask';render();}
  }else if(kind==='task-add-day'){
    var tx=document.getElementById('new-task-day');
    if(tx.value.trim()){S.tasks.push({id:uid(),title:tx.value.trim(),due:f.dataset.date,area:'',done:false});save();ui.focus='#new-task-day';render();}
  }
});

  if(el.id==='imp-acc'){ui.impAcc=el.value;return;}
  if(el.id==='fa'){ui.facc=el.value;render();}
});
