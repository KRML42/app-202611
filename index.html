<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Día</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b7a75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Día">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Figtree';font-style:normal;font-weight:300 900;font-display:swap;src:url(figtree.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:200 800;font-display:swap;src:url(bricolage.woff2) format('woff2')}
/* Plan: ficha de bolsillo en azul tinta con un único acento verde azulado.
   Pantalla de una sola columna, barra de pestañas abajo, hojas inferiores para editar. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#e8edf2; --ink:#101a2b; --muted:#566377; --line:#d9e0e8;
  --accent:#0b7a75; --accent-ink:#ffffff; --accent-soft:#d7efed;
  --good:#1b8a4b; --good-soft:#dcf3e5; --warn:#a85f00; --warn-soft:#fcebcb; --bad:#c03636; --bad-soft:#fbdcdc;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1522; --surface:#152030; --surface2:#1d2b3e; --ink:#e8eef6; --muted:#9aa8bb; --line:#26364b;
    --accent:#3dc3b8; --accent-ink:#04201e; --accent-soft:#123a39;
    --good:#4fd18a; --good-soft:#133425; --warn:#f0b24a; --warn-soft:#3a2c10; --bad:#f28080; --bad-soft:#3e1b1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1522; --surface:#152030; --surface2:#1d2b3e; --ink:#e8eef6; --muted:#9aa8bb; --line:#26364b;
  --accent:#3dc3b8; --accent-ink:#04201e; --accent-soft:#123a39;
  --good:#4fd18a; --good-soft:#133425; --warn:#f0b24a; --warn-soft:#3a2c10; --bad:#f28080; --bad-soft:#3e1b1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
.top{padding:calc(env(safe-area-inset-top) + 16px) 16px 4px}
.eyebrow{margin:0;color:var(--muted);font-size:.85rem;font-weight:500}
.demotag{background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.04em;margin-left:6px;vertical-align:1px}
h1{margin:0;font:700 2rem/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance}
main{flex:1;overflow-y:auto;padding:8px 16px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.sect{margin:20px 0 0}
.sect>h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font:600 .75rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sect>h2 .link{font-size:.8rem;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:600}
.sect>h3{margin:12px 0 4px;font:600 .85rem var(--body);color:var(--muted)}
ul.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rowmain{flex:1;min-width:0;display:grid;gap:1px}
.rowmain .t{overflow-wrap:anywhere}
.selbar{position:sticky;top:0;z-index:4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;margin:8px 0;border-radius:12px;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.selbar span{margin-right:auto}
.row.selon{background:var(--accent-soft)}
.row.selon .rowmain .t::before{content:'✓ ';color:var(--accent);font-weight:700}
.rows .rowmain{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.row.hl{background:var(--accent-soft);border-radius:10px;box-shadow:0 0 0 6px var(--accent-soft)}
.note-t{font-style:italic}
.minih{margin:12px 0 6px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.newsl{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.4}
.histrow{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.histrow .bar{grid-column:auto}
.qgrp summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;padding:4px 0}
.qgrp ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.qgrp li{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.88rem;border-top:1px solid var(--line);padding-top:6px}
.qgrp li span{min-width:0;overflow-wrap:anywhere}
.qgrp li .link2{white-space:nowrap;flex:none}
.toast{position:sticky;top:0;z-index:5;margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.92rem}
.toast button{background:var(--surface);color:var(--ink);border:0;border-radius:8px;padding:6px 10px;font-weight:600}
.rowmain .t.done{text-decoration:line-through;color:var(--muted)}
.rowmain .sub{font-size:.8rem;color:var(--muted)}
.check{position:relative;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:'';position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.x{flex:none;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:1.2rem;line-height:1;text-align:center}
.pill{flex:none;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.today{background:var(--warn-soft);color:var(--warn)}
.pill.soon{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:.85rem;flex:none}
.btn.block{display:block;width:100%;margin-top:12px}
.empty{margin:0;padding:14px 12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;font-size:.92rem}
.banner.warn{background:var(--warn-soft)}.banner.bad{background:var(--bad-soft)}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.chart .ln2{fill:none;stroke:var(--warn);stroke-width:1.6;stroke-dasharray:2 3}
.chart .ar{fill:var(--accent-soft);opacity:.55;stroke:none}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart .sf{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:4 3}
.chart .zr{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:4 3}
.chart text{font:600 10px var(--body);fill:var(--muted)}
.chart .ev{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.chart .ev.in{stroke:var(--good)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);padding:10px 12px;border-radius:12px;margin:8px 0 0;font-size:.88rem}
.habit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px;display:grid;gap:12px}
.habit .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.habit h3{margin:0;font:600 1.05rem/1.25 var(--display)}
.tag{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-top:2px}
.big{width:100%;padding:14px;border-radius:12px;border:2px solid var(--accent);color:var(--accent);font-weight:700;text-align:center}
.big.on{background:var(--accent);color:var(--accent-ink)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);font-size:1.5rem;text-align:center;background:var(--surface2)}
.count{flex:1;text-align:center}
.count b{font:700 2rem/1 var(--display)}
.count span{display:block;font-size:.8rem;color:var(--muted)}
.count.good b{color:var(--good)}
.count.warn b{color:var(--warn)}
.count.bad b{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar.warn i{background:var(--warn)}
.bar.over i{background:var(--bad)}
.over-t{color:var(--bad)}.warn-t{color:var(--warn)}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}
.streak{text-align:center}
.streak b{font:700 2.6rem/1 var(--display);color:var(--accent)}
.streak span{display:block;color:var(--muted);font-size:.85rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted)}
.note{margin:0;font-size:.8rem;color:var(--muted)}
.dots{display:flex;justify-content:space-between}
.dot{display:grid;justify-items:center;gap:3px;font-size:.7rem;color:var(--muted);padding:2px 4px;border-radius:8px;text-align:center}
.dot i{display:block;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.dot.ok i{background:var(--good);border-color:var(--good)}
.dot.bad i{background:var(--bad);border-color:var(--bad)}
.dot.na i{opacity:.35;border-style:dashed}
.dot em{font-style:normal}
.dot.now em{color:var(--ink);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin:6px 0 4px}
.seg button{padding:8px;text-align:center;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.addform{display:grid;gap:8px;margin:10px 0 6px}
.addopts{display:grid;grid-template-columns:1fr auto;gap:8px}
label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:400;font-size:1rem;width:100%;min-width:0}
textarea{min-height:120px;font:400 16px/1.4 ui-monospace,Menlo,monospace}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);font-size:.7rem;font-weight:600;text-align:center}
nav button[aria-current="page"]{color:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:5}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);display:grid;gap:12px;max-height:92%;overflow-y:auto}
.sheet h2{margin:0;font:700 1.25rem var(--display)}
.sheet-actions{display:flex;gap:8px;align-items:center;margin-top:4px}
.sheet-actions .sp{flex:1}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:8px 0 2px}
.datebar .nb{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;text-align:center;line-height:1}
.datebar .dl{text-align:center;font:600 1.05rem var(--display)}
.backnow{margin:4px 0 0}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.mh{font-size:.72rem;color:var(--muted);text-align:center;font-weight:700}
.cell{display:grid;grid-template-rows:auto 1fr;justify-items:center;align-items:center;padding:5px 0 6px;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;text-align:center}
.cell.out{opacity:.45}
.cell.today{border:2px solid var(--accent);font-weight:700}
.cell.sel{background:var(--accent-soft)}
.mk{display:flex;gap:4px;align-items:center}
.mk i{display:block;width:8px;height:8px;border-radius:50%;background:var(--line)}
.mk i.good{background:var(--good)}
.mk i.warn{background:var(--warn)}
.mk i.bad{background:var(--bad)}
.mk i.acc{background:var(--accent)}
.legend{margin:10px 0 0}
.md{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;background:var(--line)}
.md.ok{background:var(--good)}
.md.bad{background:var(--bad)}
.md.pend{background:transparent;border:2px solid var(--line)}
.md.na{opacity:.35}
.mini{display:flex;align-items:center;gap:6px}
.mini .s{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1.2rem;text-align:center;line-height:1}
.mini b{min-width:24px;text-align:center;font-family:var(--display);font-size:1.15rem}
.mini b.bad{color:var(--bad)}
.mini b.warn{color:var(--warn)}
.addform.inline .addopts{margin:0}
nav{grid-template-columns:repeat(6,1fr)}
nav button{font-size:.66rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile span{display:block;font-size:.75rem;color:var(--muted)}
.tile b{font:700 1.25rem var(--display);font-variant-numeric:tabular-nums}
.amt{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.amt.pos{color:var(--good)}
.crow{padding:10px 12px;border-bottom:1px solid var(--line);list-style:none}
.crow:last-child{border-bottom:0}
.crowbtn{display:grid;grid-template-columns:1fr auto;gap:6px 10px;width:100%;align-items:center}
.crowbtn .bar{grid-column:1/-1}
.subs{margin-top:8px;display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.srow{display:flex;justify-content:space-between;gap:10px}
.warnt{color:var(--warn);font-weight:600}
.okt{color:var(--good);font-weight:600}
.resbox{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.9rem;margin-top:8px}
.link2{color:var(--accent);font-weight:600;text-decoration:underline}
label.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
label.chk input{width:auto}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="head"></header>
  <main id="main"></main>
  <nav id="nav" aria-label="Secciones"></nav>
</div>
<div id="sheet" hidden></div>
<script src="xlsx.full.min.js" defer></script>
<script>
(function(){
'use strict';

/* ---------- Fechas ---------- */
var DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DOW=['D','L','M','X','J','V','S'];
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayStr(){return ymd(new Date());}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function utc(s){var p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function diff(a,b){return Math.round((utc(a)-utc(b))/864e5);}
function fmtDate(s){var d=parse(s);var t=DAYS[d.getDay()]+' '+d.getDate()+' de '+MONTHS[d.getMonth()];return t.charAt(0).toUpperCase()+t.slice(1);}
function relDay(s){var n=diff(s,todayStr());if(n===0)return 'hoy';if(n===1)return 'mañana';if(n===-1)return 'ayer';if(n<0)return 'hace '+(-n)+' d';return 'en '+n+' d';}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function num(x){return String(Math.round(x*10)/10).replace('.',',');}

/* ---------- Datos ---------- */
var DEMO=false;try{DEMO=localStorage.getItem('mi-dia-mode')==='demo';}catch(e){}
var KEY=DEMO?'mi-dia-demo':'mi-dia-v1';
var APP_VERSION='2026.11.22';
var CHANGES=[
  {v:'2026.11.22',items:['Tarjeta de crédito: añádela como cuenta de tipo «Tarjeta» con su límite, TIN y pago mensual. Importa su Excel como el de tus cuentas. El pago desde tu cuenta corriente se empareja solo y no cuenta como gasto: el gasto es cada compra.','En Finanzas › Cuentas ves la deuda, el crédito disponible, lo comprado y pagado este mes, los intereses y cuánto tardarías en liquidarla con tu pago mensual.','Cuadrar con el extracto: indicas el «Total deuda pendiente» y la fecha de corte; la diferencia con tus movimientos se guarda como intereses y comisiones.','Quehaceres: nuevo «Silenciar hasta» al editar uno. No aparece en Hoy ni cuenta como atrasado hasta esa fecha; si lo marcas como hecho, el silencio se quita.','Apuntar un gasto: ahora puedes marcar si es compartido (50 %, otro porcentaje o su parte en euros) al momento. Al importar el extracto, el reparto pasa al movimiento del banco.','Avisos: tarjeta al 80 % del límite o pasada, pago de la tarjeta en los próximos 7 días y extracto sin cuadrar desde hace más de un mes.']},
  {v:'2026.11.21',items:['Fijos (Finanzas › Fijos): la app detecta los cargos que se repiten (suscripciones, alquiler, recibos, tu nómina, traspasos al ahorro) y los propones para confirmar con un toque. También puedes crearlos a mano. Cada fijo se empareja solo con su movimiento del banco y mueve su fecha; si el importe cambia o no llega, te avisa.','Previsión (Finanzas › Previsión): saldo estimado a 30 días con tus fijos y tu gasto variable medio, con un gráfico y la lista de próximos movimientos. La nómina puede llegar en días distintos: se guarda con un margen y la previsión usa el peor caso para avisar.','«Libre hasta la nómina»: cuánto te queda hasta cobrar, apartando tu mínimo de seguridad. Lo ves en Hoy dentro de la tarjeta Dinero.','Mínimo de seguridad: lo defines en euros o en % de tu gasto mensual medio; al escribir uno, la app calcula el otro.','Avisos en Hoy: saldo previsto bajo tu mínimo, presupuesto al 80 % o pasado, cargos de los próximos 7 días, fijos que no llegan y cambios de precio. Cada aviso se puede posponer («Luego») o silenciar.','Nómina con margen «hasta el último día hábil del mes» (sábados y domingos no cuentan) y fijos cada 2 meses, para recibos de agua, luz o gas que no llegan todos los meses.']},
  {v:'2026.11.19.2',items:['Resumen semanal: «Gastado» y «Donde más» usan el balance de cada categoría. Si recibes dinero en una categoría y lo devuelves (o al revés) en los 14 días siguientes o anteriores, se compensan y no aparecen como un gasto grande.','Meal prep con desayunos: cada receta puede ser almuerzo o desayuno. Cada comida compara con su propio precio de comer fuera (almuerzo 7 €, desayuno 5 €, configurables en Ajustes) y en Hoy marcas cada una por separado.']},
  {v:'2026.11.19.1',items:['Copia de seguridad por correo: Más › «Enviar copia por correo» abre el menú de compartir con el archivo adjunto. Hoy te avisa cuando toca (cada mes por defecto; puedes cambiarlo o desactivarlo) y anota la fecha de tu última copia.','Reglas: buscador por texto o categoría, y al tocar una regla puedes cambiar su texto o su categoría (se reclasifican los movimientos).']},
  {v:'2026.11.19',items:['Modo demo (Más › Modo demo): carga un perfil ficticio completo, con dos meses de finanzas, metas, una receta, hábitos y listas, para enseñar la app sin mostrar tus datos. Tiene su propio almacenamiento: lo que pruebes se guarda en la demo, y tus datos reales no se ven ni se tocan. Sales cuando quieras y puedes reiniciar la demo.']},
  {v:'2026.11.18.7',items:['Apuntar un gasto en segundos (desde Hoy o Movimientos). Cuenta ya en tus presupuestos y, al importar el extracto, se une con el movimiento del banco y le pasa la categoría y la nota.','Resumen semanal: el día que elijas (lunes por defecto) Hoy te muestra tus hábitos, tareas, dinero y metas de los últimos 7 días, y eliges tus prioridades.','Prioridades de la semana: marca cualquier tarea como prioridad cuando quieras y aparecerá en Hoy.','Quehaceres: al marcar uno ves cuándo toca la próxima vez; en Hoy aparecen los «Hechos hoy» (con deshacer), en Tareas › Quehaceres los hechos de los últimos 14 días, y en cada quehacer su historial, donde puedes añadir o quitar días.','Meal prep: al pasar ingredientes a la compra puedes crear una lista nueva en ese momento, o separarlos en una lista por tienda.','Cada ingrediente puede tener su tienda habitual (por ejemplo, el pollo en Consum y la verdura en el mercado). También puedes hacer que las recetas usen ese precio.']},
  {v:'2026.11.18.6',items:['Si la app se recarga por error mientras creas una receta, una meta, un ingrediente o una división, al volver te ofrece recuperar lo que llevabas. Además se ha desactivado el gesto de deslizar hacia abajo para recargar.','Datos de ejemplo: puedes quitar solo los que no uses, o conservarlos y ocultar el aviso, sin borrar nada más.','Hábitos de reducir: el límite puede ser por día o por semana (Editar → Límite).','Hábitos: tocar un círculo de la semana marca o desmarca ese día directamente (hábitos de «hacer»). En los de reducir o dejar, abre un cuadro para corregir ese día.','Resumen de Finanzas: nueva sección «Ingresos y aportaciones», con su historial.','Seleccionar varios movimientos (mantén pulsado uno, o «Seleccionar») y cambiarlos de categoría de una vez. «Todos» marca todos los de la lista.','Desde el historial de una categoría: «Ver todos los movimientos», de todos los meses.','Corregido: el cuadro de novedades no aparecía a quien no había guardado ningún cambio desde que instaló la app.']},
  {v:'2026.11.18.5',items:['El botón atrás del móvil te lleva a la pantalla anterior de la app (por ejemplo, de un día en Movimientos a «Por clasificar»), y cierra los cuadros abiertos.','Para salir de la app hay que pulsar atrás dos veces seguidas: la primera muestra un aviso.']},
  {v:'2026.11.18.4',items:['Meal prep (en Compras): ingredientes con precios por tienda, recetas con coste por ración y aviso si pasas de tu objetivo.','«Cociné esta receta» crea una tanda; cada día marca en Hoy si comiste meal prep y la app calcula cuánto ahorras frente a comer fuera.','Los ingredientes de una receta pasan a tu lista de compras con cantidades y la tienda más barata.','Historial de categorías: ahora muestra el total de los 12 meses.']},
  {v:'2026.11.18.3',items:['Corregido: si un movimiento pendiente cambiaba de posición entre dos descargas, al importar de nuevo podía duplicarse. Ahora se reconoce por día, importe y texto, y se actualiza su saldo.','Nuevo en Cuentas: «Revisar duplicados» para encontrar y borrar duplicados que ya tengas.']},
  {v:'2026.11.18.2',items:['Metas de ahorro con sobres: tu cuenta de ahorro se reparte entre metas (fondo de emergencia, vivienda, viajes u otras) sin crear movimientos.','Cada mes la app reparte tu ahorro neto según tus porcentajes y te propone ajustes según el tiempo que falta.','Viajes: plan por partidas frente a lo gastado. Los gastos de las fechas del viaje se proponen para que confirmes cuáles son; los pagos de antes se asignan desde el movimiento.','Cada meta tiene su propia lista de tareas.']},
  {v:'2026.11.18',items:['Compartir una lista de compras por WhatsApp o copiarla, con un botón.','Historial de los últimos 12 meses de cualquier categoría o subcategoría, con media, máximo y mínimo. Se abre desde el Resumen o el Presupuesto.','En «Por clasificar» puedes marcar varios movimientos de un grupo y clasificarlos sin crear regla (útil para retiros de cajero).','Este cuadro de novedades, que aparece una vez después de cada actualización. También están en Más.']},
  {v:'2026.11.17.3',items:['Dividir un movimiento en varias líneas con su categoría, sin tocar el del banco.','Gastos compartidos: en tus presupuestos cuenta solo tu parte. Luz, agua y gas al 50 % con un botón; el alquiler como importe fijo con fecha.','Categoría Pareja › Aportación para sus Bizum: no cuentan como ingreso.','Los traspasos entre tus cuentas se emparejan solos y tu ahorro del mes es lo que pasa al ahorro menos lo que vuelve.']},
  {v:'2026.11.17',items:['La app abre al instante, también sin señal.','Notas en los movimientos y búsqueda por nota.','Editar elementos de las listas de compra.','«Por clasificar»: ordenar por monto o cantidad y ver el día de cada movimiento.','Copia de seguridad como archivo.']}
];

}

function parseDate(v){
  if(v instanceof Date&&!isNaN(v))return ymd(v);
  if(typeof v==='number'){var d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
  var s=String(v==null?'':v).trim(),m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){var y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1]);}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:'';
}
function fmtShort(s){var p=s.split('-');return p[2]+'/'+p[1];}
function median(a){a=a.slice().sort(function(x,y){return x-y;});var m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;}

function pendCands(p){
  var lo=addDays(p.date,-1),hi=addDays(p.date,5),tol=Math.max(1,Math.abs(p.a)*0.15);
  return S.fin.txns.filter(function(t){return t.acc===p.acc&&!t.rec&&!t.tr&&(t.a<0)===(p.a<0)&&t.dv>=lo&&t.dv<=hi&&Math.abs(t.a-p.a)<=tol;})
    .sort(function(a,b){return Math.abs(a.a-p.a)-Math.abs(b.a-p.a)||Math.abs(diff(a.dv,p.date))-Math.abs(diff(b.dv,p.date));});
}

  if(p.n)t.n=t.n?t.n+' · '+p.n:p.n;
  if(p.sh)t.sh=p.sh;
  t.rec=p.id;
  S.fin.pend=S.fin.pend.filter(function(x){return x!==p;});
}
function reconcile(){
  var n=0,claimed={};
  var ps=(S.fin.pend||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var ex={};ps.forEach(function(p){ex[p.id]=pendCands(p).filter(function(t){return Math.abs(t.a-p.a)<0.005;});});
  var cnt={};ps.forEach(function(p){ex[p.id].forEach(function(t){cnt[t.id]=(cnt[t.id]||0)+1;});});
  ps.forEach(function(p){var e=ex[p.id];if(e.length===1&&cnt[e[0].id]===1&&!claimed[e[0].id]){claimed[e[0].id]=1;applyPend(p,e[0]);n++;}});
  return n;
}

function isUnc(t){return !t.cat&&!t.tr&&!(t.sp&&t.sp.length);}
function accType(id){var a=accOf(id);return a?a.type:'corriente';}
function shareRuleFor(cat,sub,ym){
  var best=null;
  (S.fin.shares||[]).forEach(function(r){
    if(r.cat!==cat)return;if(r.sub&&r.sub!==sub)return;if(r.from&&r.from>ym)return;
    if(!best||(!!r.sub)>(!!best.sub)||((!!r.sub)===(!!best.sub)&&(r.from||'')>(best.from||'')))best=r;
  });
  return best;
}
function herPart(a,cat,sub,sh,ym){
  if(!(a<0))return 0;var c=catOf(cat);if(!c||c.kind!=='gasto')return 0;
  var r=sh||shareRuleFor(cat,sub,ym);if(!r||r.mode==='none')return 0;
  var x=-a,h=r.mode==='pct'?x*(+r.v||0)/100:Math.min(+r.v||0,x);
  return Math.round(Math.max(0,h)*100)/100;
}
function lineItems(t){
  var ym=t.dv.slice(0,7);
  if(t.tr){
    if(accType(t.acc)!=='corriente'||accType(t.trAcc)!=='ahorro')return [];
    return [{a:t.a,cat:'Ahorro e inversión',sub:'Traspaso',kind:'ahorro',her:0,my:t.a,tr:true}];
  }
  var src=t.sp&&t.sp.length?t.sp:[{a:t.a,cat:t.cat,sub:t.sub,sh:t.sh}];
  return src.map(function(l){var c=catOf(l.cat),h=herPart(l.a,l.cat,l.sub,l.sh,ym);return {a:l.a,cat:l.cat,sub:l.sub,kind:c?c.kind:'',her:h,my:l.a+h};});
}
function pairTransfers(){
  var F=S.fin;if(F.accounts.length<2)return 0;
  var free=F.txns.filter(function(t){return !t.tr&&!t.trNo;}),ins={},n=0;
  free.forEach(function(t){if(t.a>0){var k=t.a.toFixed(2);(ins[k]=ins[k]||[]).push(t);}});
  free.filter(function(t){return t.a<0;}).sort(function(a,b){return a.df<b.df?-1:1;}).forEach(function(o){
    var c=ins[(-o.a).toFixed(2)];if(!c)return;
    var best=null,bd=99;
    c.forEach(function(i){if(i.tr||i.acc===o.acc)return;var d=Math.abs(diff(i.df,o.df));if(d<=4&&d<bd){bd=d;best=i;}});
    if(best){o.tr=best.id;o.trAcc=best.acc;best.tr=o.id;best.trAcc=o.acc;n++;}
  });
  return n;
}
function unpair(t){
  var o=S.fin.txns.filter(function(x){return x.id===t.tr;})[0];
  [t,o].forEach(function(x){if(!x)return;delete x.tr;delete x.trAcc;x.trNo=true;});
}
function catOf(name){return S.fin.cats.filter(function(c){return c.name===name;})[0]||null;}
function subTipo(c,sub){var s=c&&c.subs.filter(function(x){return x.n===sub;})[0];return s?s.t:'variable';}
function accOf(id){return S.fin.accounts.filter(function(a){return a.id===id;})[0]||null;}
function accName(id){var a=accOf(id);return a?a.name:'?';}
function isCard(t){return /pago con tarjeta/.test(norm(t.m));}

function ruleSort(a,b){
  if(!!a.weak!==!!b.weak)return a.weak?1:-1;
  var na=a.text.split(' ').length,nb=b.text.split(' ').length;if(na!==nb)return nb-na;
  var aa=a.ref!=null?1:0,ab=b.ref!=null?1:0;if(aa!==ab)return ab-aa;
  return b.text.length-a.text.length;
}
function ruleMatches(r,t){
  if((' '+norm(t.c+' '+t.m+' '+(t.p||''))+' ').indexOf(' '+r.text+' ')<0)return false;
  if(r.ref!=null){var x=Math.abs(t.a);if(Math.abs(x-r.ref)>Math.max(0.5,r.ref*0.25))return false;}
  return true;
}
function classifyAll(){
  var rules=S.fin.rules.slice().sort(ruleSort);
  S.fin.txns.forEach(function(t){
    if(t.man)return;
    var hit=null;
    for(var i=0;i<rules.length;i++){if(ruleMatches(rules[i],t)){hit=rules[i];break;}}
    t.cat=hit?hit.cat:'';t.sub=hit?hit.sub:'';
  });
}
function addRule(text,cat,sub,ref){
  var t=norm(text);if(!t)return;
  S.fin.rules=S.fin.rules.filter(function(r){return !(r.text===t&&(r.ref||0)===(ref||0));});
  S.fin.rules.push({id:uid(),text:t,cat:cat,sub:sub,ref:ref==null?null:ref,weak:false});
  classifyAll();save();
}
function suggestKey(t){
  var tokens=norm(isCard(t)?t.c:(t.c+' '+t.m)).split(' ').filter(Boolean);
  if(t.p&&!isCard(t)&&tokens.indexOf(t.p)<0)tokens.push(t.p);
  if(isCard(t)){
    if(tokens.length&&tokens[tokens.length-1]==='es')tokens.pop();
    if(tokens.length>1&&CITIES.indexOf(tokens[tokens.length-1])>=0)tokens.pop();
  }
  var out=[];
  tokens.forEach(function(w){
    if(/^[67]\d{8}$/.test(w)){if(out[out.length-1]!==w)out.push(w);return;}
    if(/^\d+$/.test(w))return;
    if((w.match(/\d+/g)||[]).length>=2)return;
    if(out[out.length-1]===w)return;
    out.push(w);
  });
  return out.join(' ')||norm(t.c);
}
function queueGroups(){
  var g={};
  S.fin.txns.forEach(function(t){
    if(t.cat||t.tr||(t.sp&&t.sp.length))return;
    var k=suggestKey(t);
    if(!g[k])g[k]={key:k,items:[],total:0};
    g[k].items.push(t);g[k].total+=t.a;
  });
  var byN=ui.qsort==='cantidad';
  return Object.keys(g).map(function(k){return g[k];}).sort(function(a,b){return byN?(b.items.length-a.items.length)||(Math.abs(b.total)-Math.abs(a.total)):(Math.abs(b.total)-Math.abs(a.total))||(b.items.length-a.items.length);});
}
function catOptions(withEmpty){
  var o=withEmpty?[{v:'',t:'Sin clasificar'}]:[];
  S.fin.cats.forEach(function(c){
    if(!c.subs.length)o.push({v:c.name+'||',t:c.name,g:c.name});
    c.subs.forEach(function(s){o.push({v:c.name+'||'+s.n,t:c.name+' › '+s.n,g:c.name});});
  });
  return o;
}
function accBalance(a){
  if(a.type==='tarjeta'){var cd=cardDebt(a);return cd?{b:-cd.debt,date:cd.date}:null;}
  var best=null;
  S.fin.txns.forEach(function(t){
    if(t.acc!==a.id||t.b==null)return;
    if(!best||t.df>best.df||(t.df===best.df&&((t.src||'')>(best.src||'')||((t.src||'')===(best.src||'')&&t.i<best.i))))best=t;
  });
  return best?{b:best.b,date:best.df}:null;
}

/* Lectura e importación del archivo del banco */
function findHeader(rows){
  for(var i=0;i<Math.min(rows.length,40);i++){
    var n=(rows[i]||[]).map(norm);
    if(n.indexOf('importe')>=0&&n.some(function(x){return x==='fecha'||x==='f valor'||x==='fecha valor';}))return i;
  }
  return -1;
}
function readSheet(buf){
  if(!window.XLSX)return {error:'No se pudo cargar el lector de Excel. Comprueba tu conexión y vuelve a intentarlo.'};
  try{
    var wb=XLSX.read(buf,{type:'array'});
    for(var i=0;i<wb.SheetNames.length;i++){
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]],{header:1,raw:true,defval:''});
      if(findHeader(rows)>=0)return {rows:rows};
    }
    return {error:'No encuentro la fila de encabezados (Fecha, Concepto, Importe…). ¿Es el archivo de movimientos del banco?'};
  }catch(e){return {error:'No pude leer el archivo. Prueba con el .xlsx tal como lo descargas del banco.'};}
}
function phoneIn(v){
  var str=String(v==null?'':v),re=/(^|[^\d+])((?:\+|00)?34[\s.-]?)?([67](?:[\s.-]?\d){8})(?![\s.-]?\d)/g,m;
  while((m=re.exec(str))){var d=m[3].replace(/\D/g,'');if(d.length===9)return d;}
  return '';
}
function importRows(rows,accId){
  var hi=findHeader(rows);
  if(hi<0)return {error:'No encuentro la fila de encabezados (Fecha, Concepto, Importe…).'};
  var col={};
  rows[hi].map(norm).forEach(function(h,i){
    if(h==='f valor'||h==='fecha valor')col.dv=i;
    else if(h==='fecha'||h==='fecha operacion'||h==='fecha contable')col.df=i;
    else if(h==='concepto')col.c=i;
    else if(h==='movimiento')col.m=i;
    else if(h==='importe')col.amt=i;
    else if((h==='disponible'||h==='saldo')&&col.bal==null)col.bal=i;
    else if(h==='observaciones')col.obs=i;
  });
  if(col.amt==null||(col.dv==null&&col.df==null))return {error:'Faltan columnas de fecha o importe.'};
  var list=[];
  for(var r=hi+1;r<rows.length;r++){
    var row=rows[r]||[];
    var dv=parseDate(col.dv!=null?row[col.dv]:''),df=parseDate(col.df!=null?row[col.df]:''),a=parseNum(row[col.amt]);
    if(!(dv||df)||a==null)continue;
    var cc=clean(col.c!=null?row[col.c]:''),mm=clean(col.m!=null?row[col.m]:''),ob=col.obs!=null?phoneIn(row[col.obs]):'';
    if(ob&&(cc+' '+mm).indexOf(ob)>=0)ob='';
    list.push({dv:dv||df,df:df||dv,c:cc,m:mm,o:'',p:ob,a:a,b:col.bal!=null?parseNum(row[col.bal]):null});
  }
  if(!list.length)return {error:'No encontré movimientos en el archivo.'};
  if(list[0].df<list[list.length-1].df)list.reverse();
  list.forEach(function(x,i){x.i=i;});
  var links=0,breaks=0;
  for(var k=0;k<list.length-1;k++){
    var x=list[k],y=list[k+1];
    if(x.b!=null&&y.b!=null){links++;if(Math.abs((x.b-x.a)-y.b)>0.005)breaks++;}
  }
  var F=S.fin,seen={},byBal={},pool={},cnt={},used=new Set();
  var fileMax=list.reduce(function(m,x){return x.df>m?x.df:m;},'');
  function mkey(x){return [x.dv,x.a.toFixed(2),norm(x.c),norm(x.m)].join('|');}
  F.txns.forEach(function(t){if(t.acc!==accId)return;seen[t.k]=t;if(t.b!=null)byBal[[t.acc,t.df,t.a.toFixed(2),t.b.toFixed(2)].join('|')]=t;(pool[mkey(t)]=pool[mkey(t)]||[]).push(t);});
  // Emparejar cada fila del archivo con un movimiento ya guardado: primero clave exacta, luego mismo saldo,
  // y si no, mismo día valor + importe + texto (un pendiente que cambió de posición cambia su saldo).
  var matches=list.map(function(x){
    var k=[accId,x.dv,x.df,x.a.toFixed(2),x.b==null?'':x.b.toFixed(2),norm(x.c),norm(x.m)].join('|');
    if(x.b==null){cnt[k]=(cnt[k]||0)+1;k+='#'+cnt[k];}
    x.k=k;
    var ex=seen[k];if(ex&&used.has(ex))ex=null;
    if(!ex&&x.b!=null){ex=byBal[[accId,x.df,x.a.toFixed(2),x.b.toFixed(2)].join('|')];if(ex&&used.has(ex))ex=null;}
    if(!ex){var arr=pool[mkey(x)]||[];ex=arr.filter(function(t){return !used.has(t)&&t.df===x.df;})[0]||arr.filter(function(t){return !used.has(t);})[0]||null;}
    if(ex)used.add(ex);
    return ex;
  });
  var oldest=list[list.length-1],expected=oldest.b!=null?oldest.b-oldest.a:null,gap=false;
  if(expected!=null){
    var prior=F.txns.filter(function(t){return t.acc===accId&&t.df<=oldest.df&&!used.has(t);});
    if(prior.length&&!prior.some(function(t){return t.b!=null&&Math.abs(t.b-expected)<0.005;}))gap=true;
  }
  var added=0,dups=0,filled=0,upd=0,fresh=[];
  list.forEach(function(x,ix){
    var ex=matches[ix];
    if(ex){
      dups++;
      if(x.p&&!ex.p&&phonesOf(ex).indexOf(x.p)<0){ex.p=x.p;filled++;}
      if(fileMax>=(ex.src||'')){if((x.b!=null&&ex.b!==x.b)||ex.df!==x.df)upd++;if(x.b!=null)ex.b=x.b;ex.df=x.df;ex.i=x.i;ex.src=fileMax;}
      return;
    }
    var nt={id:uid(),acc:accId,k:x.k,dv:x.dv,df:x.df,c:x.c,m:x.m,o:x.o,a:x.a,b:x.b,i:x.i,src:fileMax,cat:'',sub:'',man:false};if(x.p)nt.p=x.p;
    added++;fresh.push(nt);
  });
  fresh.forEach(function(t){F.txns.push(t);});
  classifyAll();save();
  var unc=fresh.filter(isUnc).length;
  return {upd:upd,fresh:fresh,phones:list.filter(function(x){return x.p;}).length,obs:col.obs!=null,added:added,dups:dups,filled:filled,links:links,breaks:breaks,gap:gap,unc:unc,from:list.reduce(function(m,x){return x.dv<m?x.dv:m;},list[0].dv),to:list.reduce(function(m,x){return x.dv>m?x.dv:m;},list[0].dv),total:list.length};
}
function importBuffer(buf,accId){
  var rd=readSheet(buf);if(rd.error)return rd;
  return importRows(rd.rows,accId);
}
function ensureAccount(){
  var F=S.fin;
  if(!F.accounts.length)F.accounts.push({id:uid(),name:'Cuenta principal',type:'corriente'});
  var id=ui.impAcc;
  if(!id||!accOf(id))id=F.accounts[0].id;
  return id;
}
function minDate(rows){
  var hi=findHeader(rows),idx=[],m='';
  rows[hi].map(norm).forEach(function(h,i){if(h==='f valor'||h==='fecha'||h==='fecha valor')idx.push(i);});
  for(var r=hi+1;r<rows.length;r++){idx.forEach(function(i){var d=parseDate((rows[r]||[])[i]);if(d&&(!m||d<m))m=d;});}
  return m;
}
function handleFiles(list){
  var files=Array.prototype.slice.call(list||[]);
  if(!files.length)return;
  var accId=ensureAccount(),pending=files.length,loaded=[];
  function done(){
    if(--pending>0)return;
    loaded.forEach(function(x){if(x.rd.rows)x.min=minDate(x.rd.rows);});
    loaded.sort(function(a,b){return (a.min||'9999')<(b.min||'9999')?-1:(a.min||'9999')>(b.min||'9999')?1:0;});
    ui.importResults=loaded.map(function(x){var r=x.rd.error?{error:x.rd.error}:importRows(x.rd.rows,accId);r.file=x.name;return r;});
    var np=pairTransfers();var nrc=reconcile();var mo=runMonthly();ui.importResults.forEach(function(r){if(r.fresh){r.unc=r.fresh.filter(isUnc).length;delete r.fresh;}});if(np){classifyAll();save();ui.msg=np+(np===1?' traspaso nuevo emparejado':' traspasos nuevos emparejados')+' entre tus cuentas.';}
    if(nrc){ui.msg=(ui.msg?ui.msg+' ':'')+nrc+(nrc===1?' gasto apuntado se unió':' gastos apuntados se unieron')+' con su movimiento del banco.';}
    if(pendReview().length){ui.msg=(ui.msg?ui.msg+' ':'')+'Revisa los gastos apuntados en Movimientos › Apuntados.';}
    if(mo.some(function(x){return x.tot>0;})){ui.msg=(ui.msg?ui.msg+' ':'')+'Se repartió el ahorro de '+monthName(mo[mo.length-1].m)+' entre tus metas.';}
    ui.fmonth='';render();
  }
  files.forEach(function(file,idx){
    var fr=new FileReader();
    fr.onload=function(){loaded[idx]={name:file.name,rd:readSheet(fr.result)};done();};
    fr.onerror=function(){loaded[idx]={name:file.name,rd:{error:'No pude abrir el archivo.'}};done();};
    fr.readAsArrayBuffer(file);
  });
}

/* Vistas de Finanzas */
function defaultMonth(){
  var mx='';S.fin.txns.forEach(function(t){if(t.dv>mx)mx=t.dv;});
  return (mx||todayStr()).slice(0,7);
}
function monthBar(){
  var d=parse(ui.fmonth+'-01');
  return '<div class="datebar"><button class="nb" data-act="fm-prev" aria-label="Mes anterior">‹</button><span class="dl">'+cap(MONTHS[d.getMonth()])+' '+d.getFullYear()+'</span><button class="nb" data-act="fm-next" aria-label="Mes siguiente">›</button></div>';
}
function txTitle(t){var s=t.c+(t.m&&!isCard(t)?' · '+t.m:'');if(t.p&&s.indexOf(t.p)<0)s+=' · '+t.p;return disp(s);}
function txRow(t){
  var c=t.cat?esc(t.cat+(t.sub?' › '+t.sub:'')):'Sin clasificar';
  if(t.pend){c=(t.cat?esc(t.cat+(t.sub?' › '+t.sub:'')):'Sin categoría')+' · <b class="warnt">apuntado, pendiente del banco</b>';}
  else if(t.tr){var oa=accOf(t.trAcc);c='Traspaso '+(t.a<0?'a ':'desde ')+esc(oa?oa.name:'otra cuenta');}
  else if(t.sp&&t.sp.length){c='Dividido: '+esc(t.sp.map(function(l){return l.sub||l.cat;}).join(', '));}
  var lh=lineItems(t).reduce(function(m,l){return m+l.her;},0);if(lh>0)c+=' · compartido (tu parte '+money(-(t.a+lh))+')';

}
function viewFin(){
  var F=S.fin,unc=F.txns.filter(isUnc).length;
  if(!ui.fmonth)ui.fmonth=defaultMonth();
  var tabs=[['resumen','Resumen'],['mov','Movimientos'],['cola','Por clasificar'+(unc?' ('+unc+')':'')],['pres','Presupuesto'],['prev','Previsión'],['fijos','Fijos'],['metas','Metas'],['cuentas','Cuentas'],['cats','Categorías']];
  var out='<div class="chips" style="flex-wrap:wrap;overflow:visible" role="group" aria-label="Finanzas">'+tabs.map(function(t){return '<button class="chip" data-act="ftab" data-t="'+t[0]+'" aria-pressed="'+(ui.ftab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>';
  if(ui.ftab==='hist'&&ui.hist)return viewFinHist();
  if(ui.ftab==='goal'){var gg=goalOf(ui.goal);if(gg)return viewGoal(gg);ui.ftab='metas';}
  if(ui.ftab==='goalsarch')return viewGoalsArch();
  if(ui.ftab==='dups')return viewDups();

  if(ui.ftab==='prev')return out+viewFinPrev();
  if(ui.ftab==='fijos')return out+viewFinFijos();
  if(ui.ftab==='cuentas')return out+viewFinCuentas();
  if(ui.ftab==='cats')return out+viewFinCats();
  return out+viewFinResumen(unc);
}
function monthsBack(end,n){var y=+end.slice(0,4),m=+end.slice(5,7),r=[];for(var i=0;i<n;i++){r.unshift(y+'-'+(m<10?'0':'')+m);m--;if(!m){m=12;y--;}}return r;}
function histData(cat,sub){
  var r={},first='';
  allTxns().forEach(function(t){var ym=t.dv.slice(0,7);if(!first||ym<first)first=ym;
    lineItems(t).forEach(function(l){if(l.cat!==cat||(sub&&l.sub!==sub))return;r[ym]=(r[ym]||0)+(l.kind==='gasto'?-l.my:l.a);});});
  return {by:r,first:first};
}
function shortMonth(ym){var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return M[+ym.slice(5,7)-1]+' '+ym.slice(2,4);}
function r2(n){return Math.round(n*100)/100;}
function ymAdd(ym,k){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+(m<9?'0':'')+(m+1);}
function ymDiff(a,b){return (+a.slice(0,4)*12+ +a.slice(5,7))-(+b.slice(0,4)*12+ +b.slice(5,7));}
function goalsActive(){return (S.fin.goals||[]).filter(function(g){return !g.arch;});}
function goalOf(id){return (S.fin.goals||[]).filter(function(g){return g.id===id;})[0]||null;}
function goalBal(id){var b=0;S.fin.alloc.forEach(function(x){if(x.goal===id)b+=x.amt;});return r2(b);}
function savingsTotal(){
  var accs=S.fin.accounts.filter(function(a){return a.type==='ahorro';}),tot=0,has=false;
  accs.forEach(function(a){var b=accBalance(a);if(b){tot+=b.b;has=true;}});
  if(has)return {v:r2(tot),real:true};
  var v=0;S.fin.txns.forEach(function(t){if(accType(t.acc)!=='corriente')return;lineItems(t).forEach(function(l){if(l.kind==='ahorro')v+=-l.a;});});
  return {v:r2(v),real:false};
}
function allocatedTotal(){var v=0;S.fin.alloc.forEach(function(x){if(x.goal)v+=x.amt;});return r2(v);}
function unassigned(){return r2(savingsTotal().v-allocatedTotal());}
function monthSaving(ym){var v=0;S.fin.txns.forEach(function(t){if(t.dv.slice(0,7)!==ym||accType(t.acc)!=='corriente')return;lineItems(t).forEach(function(l){if(l.kind==='ahorro')v+=-l.a;});});return r2(v);}
function lastDataDay(){var mx='';S.fin.txns.forEach(function(t){if(accType(t.acc)==='corriente'&&t.dv>mx)mx=t.dv;});return mx;}
function monthComplete(m){var mx=lastDataDay();return !!mx&&m<todayStr().slice(0,7)&&mx>=m+'-28';}
function fullMonths(n){
  var mx=lastDataDay(),r=[];if(!mx)return r;
  var first='';S.fin.txns.forEach(function(t){var x=t.dv.slice(0,7);if(!first||x<first)first=x;});
  var m=ymAdd(todayStr().slice(0,7),-1);
  while(m>=first&&!monthComplete(m))m=ymAdd(m,-1);
  for(var i=0;i<n&&m>=first;i++){r.unshift(m);m=ymAdd(m,-1);}
  return r;
}
function avgSaving(){var ms=fullMonths(3);if(!ms.length)return 0;return r2(ms.reduce(function(a,m){return a+monthSaving(m);},0)/ms.length);}
function fixedAvg(){
  var ms=fullMonths(3);if(!ms.length)return 0;var v=0;
  S.fin.txns.forEach(function(t){if(ms.indexOf(t.dv.slice(0,7))<0)return;lineItems(t).forEach(function(l){if(l.kind==='gasto'&&subTipo(catOf(l.cat),l.sub)==='fijo')v+=-l.my;});});
  return r2(v/ms.length);
}
function monthsLeft(g){var cur=todayStr().slice(0,7);return Math.max(1,ymDiff(g.due,cur)+1);}
function goalStatus(g,avg){
  var bal=goalBal(g.id),rem=r2(Math.max(0,g.target-bal)),per=(g.pct||0)/100*avg;
  if(rem<=0)return {cls:'okt',txt:'Objetivo alcanzado'};
  if(g.due){
    var ml=monthsLeft(g),need=r2(rem/ml),proj=bal+per*ml,min=g.min||g.target;
    var st=proj>=g.target-0.5?{cls:'okt',txt:'Va bien'}:proj>=min-0.5?{cls:'warnt',txt:'Va justo'+(g.min?': llegas al mínimo':'')}:{cls:'over-t',txt:'No llega a tiempo con el reparto actual'};
    st.need=need;st.ml=ml;st.proj=r2(proj);return st;
  }
  if(per<=0)return {cls:'warnt',txt:'Sin aportación mensual: sube su porcentaje'};
  var n=Math.ceil(rem/per);return {cls:'',txt:'A tu ritmo llegas hacia '+monthName(ymAdd(todayStr().slice(0,7),n-1)),eta:n};
}
function proposal(){
  var avg=avgSaving(),gs=goalsActive();if(!(avg>0)||!gs.length)return null;
  var res={},used=0,short=[];
  gs.forEach(function(g){res[g.id]=0;if(!g.due)return;var rem=Math.max(0,g.target-goalBal(g.id));if(!rem)return;var p=rem/monthsLeft(g)/avg*100;res[g.id]=p;used+=p;});
  if(used>100){gs.forEach(function(g){if(g.due&&res[g.id]){short.push(g.name);res[g.id]=res[g.id]*100/used;}});used=100;}
  var left=100-used,und=gs.filter(function(g){return !g.due&&g.target-goalBal(g.id)>0;}),w=und.reduce(function(a,g){return a+(g.pct||0);},0);
  und.forEach(function(g){res[g.id]=w>0?left*(g.pct||0)/w:left/und.length;});
  var tot=0,keys=Object.keys(res);keys.forEach(function(k){res[k]=Math.floor(res[k]);tot+=res[k];});
  var cap=und.length?100:Math.round(Math.min(100,used));
  keys.sort(function(a,b){return res[b]-res[a];});var i=0;while(tot<cap&&keys.length){res[keys[i%keys.length]]++;tot++;i++;}
  return {pct:res,avg:avg,short:short};
}
function runMonthly(){
  var F=S.fin,gs=goalsActive();if(!gs.length||!F.goalStart)return [];
  var mx=lastDataDay(),cur=todayStr().slice(0,7),out=[];if(!mx)return out;
  var m=F.allocDone?ymAdd(F.allocDone,1):ymAdd(F.goalStart,1);
  while(m<cur&&monthComplete(m)){
    if(F.noAuto===m){F.allocDone=m;m=ymAdd(m,1);continue;}
    var n=monthSaving(m),tot=0;
    if(n>0)gs.forEach(function(g){var a=r2(n*(g.pct||0)/100);if(a>0){F.alloc.push({id:uid(),goal:g.id,amt:a,date:m+'-28',kind:'auto',m:m});tot+=a;}});
    F.allocDone=m;out.push({m:m,n:n,tot:r2(tot)});m=ymAdd(m,1);
  }
  if(out.length){F.cardM=out[out.length-1].m;save();}
  return out;
}
var TRIP_PLAN=[['Vuelos y transporte',30],['Alojamiento',30],['Comida',15],['Actividades',10],['Transporte local',5],['Compras y otros',0],['Colchón',10]];
var HOME_PLAN=[['Entrada',70],['Gastos de compra',20],['Mudanza y muebles',10]];
function partOf(g,t,l){
  var plan=g.plan||[];if(!plan.length)return '';
  if(t.gpart&&plan.some(function(x){return x.n===t.gpart;}))return t.gpart;
  var c=norm(l.cat),sb=norm(l.sub);
  function f(k){var x=plan.filter(function(p){return norm(p.n).indexOf(k)>=0;})[0];return x?x.n:'';}
  var r='';
  if(sb.indexOf('aloj')>=0)r=f('aloj');
  else if(c==='viajes'&&sb.indexOf('transp')>=0)r=f('vuelo');
  else if(c==='transporte')r=f('transporte local')||f('transp');
  else if(c==='restauracion'||c==='alimentacion')r=f('comida');
  else if(sb.indexOf('activ')>=0||c.indexOf('ocio')>=0)r=f('activ');
  else if(c==='compras')r=f('compra');
  return r||f('otro')||plan.filter(function(p){return norm(p.n).indexOf('colch')<0;}).slice(-1).map(function(p){return p.n;})[0]||'';
}
function tripReal(g){
  var by={},tot=0,list=[];
  S.fin.txns.forEach(function(t){if(t.goal!==g.id)return;list.push(t);lineItems(t).forEach(function(l){if(l.a>=0&&l.kind!=='gasto')return;var v=l.kind==='gasto'?-l.my:-l.a;if(!v)return;var pn=partOf(g,t,l);by[pn]=(by[pn]||0)+v;tot+=v;});});
  return {by:by,tot:r2(tot),list:list};
}
function tripCandidates(g){
  if(!g.start||!g.end)return [];
  return S.fin.txns.filter(function(t){return t.a<0&&!t.tr&&!t.goal&&t.dv>=g.start&&t.dv<=g.end&&(t.gno||[]).indexOf(g.id)<0;})
    .sort(function(a,b){return a.dv<b.dv?-1:1;});
}
function looksRecurring(t){var c=catOf(t.cat);if(!c)return false;if(t.cat==='Vivienda')return true;return subTipo(c,t.sub)==='fijo'||/suscrip/i.test(t.sub);}
function goalCard(g,avg){

/* Emparejar un movimiento real con un fijo */
function recMatchTx(r,t){

}

  if(!r.key)return null;
  var best=null,since=r.since||'';
  S.fin.txns.forEach(function(t){if(t.dv<since||!recMatchTx(r,t))return;if(!best||t.dv>best.dv)best=t;});

function recStep(r,d){

  [-1,0,1].forEach(function(k){var m=ymAdd(ym,k),a=ymdOf(m,offDay(m,r)),x=Math.abs(diff(a,d));if(x<bd){bd=x;best=m;}});

  if(r.lastBiz){var lb=lastBizDay(nm);if(res>lb)res=lb;}

}

  return n;
}

/* Detección de cargos que se repiten */
function recDetect(){
  if(RD)return RD;
  var F=S.fin,groups={};
  F.txns.forEach(function(t){
    if(accType(t.acc)!=='corriente'||(t.tr&&t.a>=0)||t.goal)return;
    var k=recKeyOf(t);if(k.length<3)return;
    var g=(t.a<0?'-':'+')+(t.tr?'T':'')+'|'+k;(groups[g]=groups[g]||[]).push(t);
  });
  var out=[];
  Object.keys(groups).forEach(function(g){
    if(recCovered(g))return;
    var L=groups[g].slice().sort(function(a,b){return a.dv<b.dv?-1:1;}),key=g.split('|')[1],neg=g.charAt(0)==='-',tr=g.split('|')[0].indexOf('T')>0;
    if(L.length<2)return;
    var ds=L.map(function(t){return t.dv;}),iv=[];
    for(var i=1;i<ds.length;i++){var x=diff(ds[i],ds[i-1]);if(x>=3)iv.push(x);}
    if(!iv.length)return;
    var mi=median(iv);
    function share(lo,hi){return iv.filter(function(x){return x>=lo&&x<=hi;}).length/iv.length;}
    var freq=null;
    if(mi>=26&&mi<=35&&share(24,38)>=0.7&&L.length>=3)freq='mes';
    else if(mi>=6&&mi<=8&&share(6,8)>=0.8&&L.length>=4)freq='sem';
    else if(mi>=55&&mi<=68&&share(52,70)>=0.7&&L.length>=2)freq='bim';
    else if(mi>=84&&mi<=97&&share(80,100)>=0.7&&L.length>=3)freq='trim';
    else if(mi>=350&&mi<=380&&L.length>=2)freq='ano';
    if(!freq)return;
    var am=L.map(function(t){return Math.abs(t.a);}),med=median(am),mx=Math.max.apply(null,am.map(function(v){return Math.abs(v-med);}))/(med||1),vr=false;
    if(freq==='bim'&&L.length<3&&mx>0.12)return;
    if(mx>0.12){if((freq==='mes'||freq==='bim')&&mx<=0.5&&med>=15&&iv.every(function(x){return freq==='mes'?(x>=25&&x<=37):(x>=52&&x<=70);}))vr=true;else return;}
    var last=L[L.length-1],cl=null;
    for(var j=L.length-1;j>=0;j--){if(L[j].cat){cl=L[j];break;}}
    var rec3=L.slice(-3).map(function(t){return Math.abs(t.a);}),amt=r2(vr?med:median(rec3));
    var days=ds.map(function(d){return +d.slice(8,10);}),bd=(freq==='mes'||freq==='bim')&&days.some(function(d){return d<=8;})&&days.some(function(d){return d>=24;});
    var offs=bd?ds.map(dayOff):days,off=Math.round(median(offs)),win=Math.min(10,Math.max.apply(null,offs.map(function(o){return Math.abs(o-off);})));
    var tc=tr&&last.trAcc?accType(last.trAcc):'';
    var r={id:uid(),name:tr?(tc==='tarjeta'?'Pago de la tarjeta':'Traspaso a ahorro'):niceName((last.c||'').replace(/^recibo\s+/i,'')),a:neg?-amt:amt,freq:freq,off:off,bd:bd,win:(freq==='mes'||freq==='bim')?win:0,lastBiz:!neg&&freq==='mes'&&!bd&&median(days)>=25,vr:vr,tr:tr,card:tc==='tarjeta',key:key,gk:g,
      cat:cl?cl.cat:'',sub:cl?cl.sub:'',start:'',since:'',stop:false,n:L.length};

}

function histSpend(exRec){

  if(!ms.length){HS[k]={m:0,d:0,n:0};return HS[k];}
  S.fin.txns.forEach(function(t){
    if(ms.indexOf(t.dv.slice(0,7))<0||t.goal||accType(t.acc)!=='corriente')return;

    var st=recState(r);if(st.st==='stale')return;
    var e=st.e,first=true,k=0;
    while(e<=end&&k<80){
      var d=e;
      if(first){
        if(st.st==='late')d=null;
        else if(e<T)d=r.a<0?T:null;
        else if(late&&r.a>0)d=recLateDate(r,e);
      }else if(late&&r.a>0)d=recLateDate(r,e);
      if(d&&d<=end)ev.push({d:d,rid:r.id,name:r.name,a:r.a,inc:r.a>0,tr:!!r.tr,card:!!r.card});
      e=recStep(r,e);first=false;k++;
    }
  });
  ev.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.a-b.a;});
  var pts=[],bal=start;
  for(var i=0;i<=n;i++){
    var d2=addDays(T,i);
    ev.forEach(function(x){if(x.d===d2){bal+=x.a;x.after=r2(bal);}});
    bal-=vb;
    pts.push({d:d2,bal:r2(bal)});
  }
  FC[key]={pts:pts,ev:ev,start:r2(start),vb:vb,n:hs.n,gap:gap,sb:sb,dl:dl};
  return FC[key];
}
function payday(){
  var best=null;
  S.fin.recur.forEach(function(r){if(r.stop||!(r.a>0)||r.tr)return;var c=catOf(r.cat);if(!c||c.kind!=='ingreso')return;if(!best||r.a>best.a)best=r;});
  return best;
}
function freePay(){
  var p=payday();if(!p)return null;
  var fc=forecast(60,true);if(!fc)return null;
  var T=todayStr(),ev=fc.ev.filter(function(x){return x.rid===p.id;})[0];
  if(!ev)return {none:true,p:p,st:recState(p)};
  var days=diff(ev.d,T),lo=null;
  fc.pts.forEach(function(q){if(q.d<ev.d&&(lo==null||q.bal<lo))lo=q.bal;});
  if(lo==null||days<=0)return {p:p,days:0};
  var si=safeInfo(),libre=r2(lo-si.eur);
  return {p:p,days:days,libre:libre,perDay:libre/days,typ:recNext(p),late:ev.d,min:lo,safe:si.eur};
}

/* Pantalla Previsión */
function prevChart(fc0,fc1,thr){
  var W=340,H=156,pl=46,pr=8,pt=10,pb=22,vals=fc0.pts.map(function(p){return p.bal;}),v1=fc1.pts.map(function(p){return p.bal;});
  var all=vals.concat(v1,[thr||0,0]),mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
  if(mx-mn<1)mx=mn+1;
  var pad=(mx-mn)*0.08;mn-=pad;mx+=pad;
  function X(i){return pl+(W-pl-pr)*i/(vals.length-1);}
  function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));}
  function path(a){return a.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join('');}
  function lab(v){return Math.round(v).toLocaleString('es-ES')+' €';}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Previsión del saldo a 30 días: de '+money(vals[0])+' a '+money(vals[vals.length-1])+'">';
  s+='<line class="gr" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(mx-pad).toFixed(1)+'" y2="'+Y(mx-pad).toFixed(1)+'"/><line class="gr" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(mn+pad).toFixed(1)+'" y2="'+Y(mn+pad).toFixed(1)+'"/>';
  if(Math.min.apply(null,all)<0)s+='<line class="zr" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'"/>';
  if(thr>0)s+='<line class="sf" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(thr).toFixed(1)+'" y2="'+Y(thr).toFixed(1)+'"/><text x="'+(W-pr)+'" y="'+(Y(thr)-3).toFixed(1)+'" text-anchor="end">mínimo</text>';
  s+='<path class="ar" d="'+path(vals)+'L'+X(vals.length-1).toFixed(1)+' '+(H-pb)+'L'+X(0).toFixed(1)+' '+(H-pb)+'Z"/>';
  if(v1.some(function(v,i){return Math.abs(v-vals[i])>0.5;}))s+='<path class="ln2" d="'+path(v1)+'"/>';
  s+='<path class="ln" d="'+path(vals)+'"/>';
  fc0.ev.forEach(function(x){if(Math.abs(x.a)<Math.max(100,Math.abs(vals[0])*0.05))return;var i=diff(x.d,fc0.pts[0].d);if(i<0||i>=vals.length)return;s+='<circle class="ev'+(x.inc?' in':'')+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(vals[i]).toFixed(1)+'" r="3.2"/>';});
  s+='<text x="'+(pl-4)+'" y="'+(Y(mx-pad)+3).toFixed(1)+'" text-anchor="end">'+lab(mx-pad)+'</text><text x="'+(pl-4)+'" y="'+(Y(mn+pad)+3).toFixed(1)+'" text-anchor="end">'+lab(mn+pad)+'</text>';
  s+='<text x="'+pl+'" y="'+(H-6)+'">'+fmtShort(fc0.pts[0].d)+'</text><text x="'+X((vals.length-1)/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+fmtShort(fc0.pts[Math.floor((vals.length-1)/2)].d)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+fmtShort(fc0.pts[vals.length-1].d)+'</text>';
  return s+'</svg>';
}

  var init=r?{name:r.name,kind:r.a>0?'in':'out',amt:String(Math.abs(r.a)).replace('.',','),vr:r.vr?'1':'',freq:r.freq,date:recNext(r),win:String(r.win||0),lb:r.lastBiz?'1':'',key:r.key||'',cat:r.cat?r.cat+'||'+(r.sub||''):'',stop:r.stop?'1':''}
    :{name:'',kind:'out',amt:'',vr:'',freq:'mes',date:addDays(T,7),win:'0',lb:'',key:'',cat:'',stop:''};
  var lt=r?recLastTx(r):null;
  openSheet({title:isNew?'Nuevo fijo':'Editar fijo',values:Object.assign({},init),
    note:'Con el texto del banco, la app empareja el cargo real y mueve la fecha sola. Sin él, se da por pagado en la fecha esperada.',
    fieldsFn:function(v){
      var f=[{id:'name',label:'Nombre',value:v.name,required:true,placeholder:'Ej.: Netflix'},
        {id:'kind',label:'Tipo',type:'select',value:v.kind,re:true,options:[{v:'out',t:'Gasto'},{v:'in',t:'Ingreso'}]},
        {id:'amt',label:'Importe (€)',value:v.amt,inputmode:'decimal',required:true},
        {id:'vr',label:'¿El importe cambia?',type:'select',value:v.vr,options:[{v:'',t:'Siempre igual'},{v:'1',t:'Cambia cada vez (uso la media)'}]},
        {id:'freq',label:'Se repite',type:'select',value:v.freq,options:[{v:'mes',t:'Cada mes'},{v:'bim',t:'Cada 2 meses'},{v:'sem',t:'Cada semana'},{v:'trim',t:'Cada 3 meses'},{v:'ano',t:'Cada año'}]},
        {id:'date',label:'Próxima fecha esperada',type:'date',value:v.date,required:true}];
      if(v.kind==='in'){f.push({id:'lb',label:'Margen de retraso',type:'select',value:v.lb,re:true,options:[{v:'',t:'Unos días'},{v:'1',t:'Hasta el último día hábil del mes'}]});if(!v.lb)f.push({id:'win',label:'Puede retrasarse hasta (días)',type:'number',min:0,max:15,value:v.win});}
      f.push({id:'key',label:'Texto del banco que lo identifica (opcional)',value:v.key,placeholder:'Ej.: netflix'});
      if(v.kind!=='in')f.push({id:'cat',label:'Categoría',type:'select',value:v.cat,options:[{v:'',t:'Sin categoría'}].concat(catOptions(false))});
      if(lt)f.push({type:'info',id:'lt',text:'Último cargo emparejado: '+fmtShort(lt.dv)+' · '+money(lt.a)+'.'});
      f.push({id:'stop',label:'Estado',type:'select',value:v.stop,options:[{v:'',t:'Activo'},{v:'1',t:'Pausado (no cuenta en la previsión)'}]});
      return f;
    },
    onSave:function(v){
      var amt=num2(v.amt);
      if(!v.name.trim())return 'Pon un nombre.';
      if(!(amt>0))return 'Escribe el importe.';
      if(!v.date)return 'Indica la próxima fecha esperada.';
      var o=r||{id:uid(),off:1,bd:false,win:0,since:'',start:v.date},neg=v.kind!=='in',freqChanged=!!r&&v.freq!==r.freq;
      o.name=v.name.trim();o.a=r2(neg?-amt:amt);o.freq=v.freq;o.vr=!!v.vr;o.stop=!!v.stop;
      o.key=recKeyClean(v.key);
      if(neg){var cp=v.cat?splitCat(v.cat):['',''];o.cat=cp[0];o.sub=cp[1];o.win=o.win||0;o.lastBiz=false;}
      else{var cc=catOf(o.cat);if(!cc||cc.kind!=='ingreso'){o.cat='Ingresos';o.sub='Nómina';}o.lastBiz=v.lb==='1'&&o.freq==='mes';o.win=o.lastBiz?0:Math.max(0,Math.min(15,parseInt(v.win,10)||0));}
      if(isNew||v.date!==init.date||freqChanged){
        o.start=v.date;o.since=addDays(v.date,-Math.round(PERIOD[o.freq]*0.6));
        if(o.freq==='mes'||o.freq==='bim'){o.off=+v.date.slice(8,10);o.bd=false;}
      }
      o.gk=recGk(o);
      if(isNew)S.fin.recur.push(o);
    },
    onDelete:isNew?null:function(){S.fin.recur=S.fin.recur.filter(function(x){return x!==r;});}});
}
function openSafeSheet(){
  var s=S.fin.safe||{eur:0,pct:0,src:'eur'},si=safeInfo();
  var init={eur:si.eur?String(si.eur).replace('.',','):'',pct:si.pct?String(si.pct).replace('.',','):''};
  function txt(v){
    var base=si.base,e=num2(v.eur),p=num2(v.pct),src=v.eur!==init.eur?'eur':(v.pct!==init.pct?'pct':(s.src||'eur'));
    if(!(base>0))return 'Aún no hay historial de gasto para calcular el porcentaje. Se usará la cifra en euros.';
    if(src==='eur')return e>0?money(e)+' equivale al '+num(e/base*100)+' % de tu gasto mensual medio ('+money(base)+').':'Sin mínimo: solo te aviso si el saldo previsto es negativo.';
    return p>0?(num(p)+' % de tu gasto mensual medio ('+money(base)+') son '+money(base*p/100)+'.'):'Sin mínimo: solo te aviso si el saldo previsto es negativo.';
  }
  openSheet({title:'Mínimo de seguridad',values:Object.assign({},init),
    note:'Escribe una cifra o un porcentaje; la app calcula el otro con tu gasto mensual medio. Vale el campo que cambies.',
    fieldsFn:function(v){return [{id:'eur',label:'En euros',value:v.eur,inputmode:'decimal',placeholder:'Ej.: 400'},{id:'pct',label:'En % de tu gasto mensual medio',value:v.pct,inputmode:'decimal',placeholder:'Ej.: 15'},{type:'info',id:'eq',text:txt(v)}];},
    live:{id:'eq',fn:txt},
    onSave:function(v){
      var e=num2(v.eur)||0,p=num2(v.pct)||0,base=si.base,src=s.src||'eur';
      if(v.eur!==init.eur)src='eur';else if(v.pct!==init.pct)src='pct';
      if(src==='pct'&&!(base>0))src='eur';
      if(src==='pct')S.fin.safe={eur:0,pct:Math.max(0,p),src:'pct'};
      else S.fin.safe={eur:Math.max(0,r2(e)),pct:0,src:'eur'};
    }});
}
/* ===== Tarjeta de crédito ===== */
function accTypeName(t){return t==='ahorro'?'Ahorro':t==='tarjeta'?'Tarjeta de crédito':'Corriente';}
function cards(){return S.fin.accounts.filter(function(a){return a.type==='tarjeta';});}
function cardDebt(a){
  if(!a||a.type!=='tarjeta'||!a.anchor||a.anchor.debt==null)return null;
  var d=a.anchor.debt,last=a.anchor.date;
  S.fin.txns.forEach(function(t){if(t.acc!==a.id||t.dv<=a.anchor.date)return;d-=t.a;if(t.dv>last)last=t.dv;});
  return {debt:r2(d),date:last,anchor:a.anchor.date};
}
function cardExpectedAt(a,date){
  if(!a.anchor||a.anchor.debt==null)return null;
  var d=a.anchor.debt;
  S.fin.txns.forEach(function(t){if(t.acc===a.id&&t.dv>a.anchor.date&&t.dv<=date)d-=t.a;});
  return r2(d);
}
function cardPay(a){
  if(a.pay>0)return a.pay;
  var r=S.fin.recur.filter(function(x){return x.card&&!x.stop;})[0];
  return r?Math.abs(r.a):0;
}
function cardPayoff(debt,tin,pay){
  if(!(debt>0))return {n:0,int:0};
  if(!(pay>0))return null;
  var r=(tin||0)/1200,n=0,I=0,B=debt;
  if(r>0&&pay<=B*r+0.005)return {stuck:true,int:r2(B*r)};
  while(B>0.005&&n<240){var i=B*r;I+=i;B=B+i-pay;n++;}
  return {n:n,int:r2(I)};
}
function cardInfo(a){
  var cd=cardDebt(a);if(!cd)return {cd:null};
  var lim=a.limit>0?a.limit:0,tin=a.tin>0?a.tin:0,ym=todayStr().slice(0,7),buy=0,paid=0,interest=0,from=addDays(todayStr(),-365);
  S.fin.txns.forEach(function(t){
    if(t.acc!==a.id)return;
    if(t.adj==='int'&&t.dv>=from)interest+=-t.a;
    if(t.dv.slice(0,7)!==ym||t.adj)return;
    if(t.a<0)buy+=-t.a;else paid+=t.a;
  });
  var pay=cardPay(a);
  return {cd:cd,lim:lim,tin:tin,avail:lim?r2(lim-cd.debt):null,use:lim?cd.debt/lim:null,buy:r2(buy),paid:r2(paid),interest:r2(interest),estInt:tin?r2(Math.max(0,cd.debt)*tin/1200):0,pay:pay,payoff:cardPayoff(cd.debt,tin,pay)};
}
function cardSection(a){
  var ci=cardInfo(a),out='<section class="sect"><h2>'+esc(a.name)+'</h2>';
  if(!ci.cd){
    return out+'<p class="note">Para llevar la deuda, indica cuánto debes según tu último extracto («Total deuda pendiente de pago») y su fecha de corte. Después importa los movimientos posteriores.</p><button class="btn primary block" style="margin-top:8px" data-act="card-cuadre" data-id="'+a.id+'">Indicar deuda actual</button><button class="btn block" style="margin-top:8px" data-act="acc-edit" data-id="'+a.id+'">Editar tarjeta</button></section>';
  }
  var tiles='<div class="tile"><span>Deuda actual</span><b>'+money(ci.cd.debt)+'</b></div>';
  if(ci.avail!=null)tiles+='<div class="tile"><span>Crédito disponible</span><b class="'+(ci.avail<0?'over-t':ci.use>=0.8?'warn-t':'')+'">'+money(ci.avail)+'</b><span>'+Math.round(ci.use*100)+' % del límite</span></div>';
  tiles+='<div class="tile"><span>Compras este mes</span><b>'+money(ci.buy)+'</b></div><div class="tile"><span>Pagado este mes</span><b>'+money(ci.paid)+'</b></div>';
  if(ci.tin)tiles+='<div class="tile"><span>Intereses al mes (aprox.)</span><b>'+money(ci.estInt)+'</b></div>';
  tiles+='<div class="tile"><span>Intereses y comisiones, 12 meses</span><b>'+money(ci.interest)+'</b></div>';
  out+='<div class="tiles">'+tiles+'</div>';
  var po=ci.payoff;
  if(ci.pay>0&&po){
    if(po.stuck)out+='<p class="note warnt">Con '+money(ci.pay)+' al mes no cubres los intereses (≈ '+money(po.int)+'): la deuda no baja.</p>';
    else if(po.n>0)out+='<p class="note">Pagando '+money(ci.pay)+' al mes'+(ci.tin?' con un TIN del '+num(ci.tin)+' %':'')+', la deuda actual se liquida en unos '+po.n+' meses'+(ci.tin?' y pagarías ≈ '+money(po.int)+' de intereses':'')+', si no compras más con la tarjeta.</p>';
  }else if(!(ci.pay>0))out+='<p class="note">Indica tu pago mensual en «Editar tarjeta» para estimar cuándo la liquidas.</p>';
  out+='<p class="note" style="margin-top:6px">Deuda a '+fmtShort(ci.cd.date)+' según tus movimientos'+(a.anchor?' desde el último cuadre ('+fmtShort(a.anchor.date)+')':'')+'.</p>';
  out+='<div style="display:grid;gap:8px;margin-top:8px"><button class="btn primary block" data-act="card-cuadre" data-id="'+a.id+'">Cuadrar con el extracto</button><button class="btn block" data-act="acc-edit" data-id="'+a.id+'">Editar tarjeta</button></div>';
  return out+'</section>';
}
function openCuadreSheet(a){
  if(!a)return;
  var T=todayStr(),pe=ymdOf(ymAdd(T.slice(0,7),-1),31);
  if(a.anchor&&pe<=a.anchor.date)pe=T;
  var first=!a.anchor,warned=false;
  function info(v){
    if(first)return 'Es la primera vez: este dato será el punto de partida. No se registra ningún ajuste.';
    if(!v.date||v.date<=a.anchor.date)return 'La fecha de corte debe ser posterior al último cuadre ('+fmtShort(a.anchor.date)+').';
    var ex=cardExpectedAt(a,v.date),real=num2(v.debt);
    if(real==null)return 'Con tus movimientos, la deuda debería ser '+money(ex)+'.';
    var d=r2(real-ex),est=a.tin>0?r2(Math.max(0,ex)*a.tin/1200):0;
    if(d>0.005)return 'Esperaba '+money(ex)+'. Diferencia de '+money(d)+(est?' (intereses esperados ≈ '+money(est)+')':'')+': se registrará como intereses y comisiones.';
    if(d<-0.005)return 'Esperaba '+money(ex)+'. El banco indica '+money(-d)+' menos: puede faltar algún pago o abono sin importar. Se ajusta el saldo.';
    return 'Esperaba '+money(ex)+'. Cuadra exactamente.';
  }
  openSheet({title:'Cuadrar '+a.name,values:{date:pe,debt:''},
    note:first?'Usa el «Total deuda pendiente de pago» de tu último extracto y su fecha de corte.':'Escribe el «Total deuda pendiente de pago» del extracto y su fecha de corte.',
    fieldsFn:function(v){return [{id:'date',label:'Fecha de corte del extracto',type:'date',value:v.date,required:true},{id:'debt',label:'Total deuda pendiente (€)',value:v.debt,inputmode:'decimal',required:true},{type:'info',id:'ci',text:info(v)}];},
    live:{id:'ci',fn:info},
    onSave:function(v){
      var real=num2(v.debt);
      if(!v.date)return 'Indica la fecha de corte.';
      if(!(real>=0))return 'Escribe la deuda pendiente.';
      if(!first){
        if(v.date<=a.anchor.date)return 'La fecha de corte debe ser posterior al último cuadre ('+fmtShort(a.anchor.date)+').';
        var ex=cardExpectedAt(a,v.date),d=r2(real-ex),est=a.tin>0?Math.max(0,ex)*a.tin/1200:0;
        if(d>0.005&&!warned&&d>2*est+5){warned=true;return 'La diferencia ('+money(d)+') es mucho mayor que los intereses esperados ('+money(est)+'). Puede que falten movimientos de este periodo: impórtalos antes. Si es correcto, pulsa Guardar otra vez.';}
        if(d>0.005){S.fin.txns.push({id:uid(),acc:a.id,k:'adj|'+a.id+'|'+v.date,dv:v.date,df:v.date,c:'INTERESES Y COMISIONES (EXTRACTO)',m:'AJUSTE',o:'',a:-d,b:null,i:-1,src:'',cat:'Finanzas',sub:'Intereses',man:true,adj:'int'});ui.msg='Tarjeta cuadrada. Intereses y comisiones registrados: '+money(d)+'.';}
        else if(d<-0.005)ui.msg='Tarjeta cuadrada. El banco indica '+money(-d)+' menos que tus movimientos: revisa si falta algún pago.';
        else ui.msg='Tarjeta cuadrada: coincide con el extracto.';
      }else ui.msg='Deuda inicial guardada: '+money(real)+'.';
      a.anchor={date:v.date,debt:r2(real)};
    }});
}
function viewFinPres(){
  var F=S.fin,sp=spendByCat(ui.fmonth),out=monthBar();
  var gcats=F.cats.filter(function(c){return c.kind==='gasto';});
  var bt=0,bs=0;
  gcats.forEach(function(c){var b=F.budgets[c.name];if(b>0){bt+=b;bs+=Math.max(0,sp[c.name]||0);}});
  var inc=0;F.txns.forEach(function(t){if(t.dv.slice(0,7)!==ui.fmonth)return;lineItems(t).forEach(function(l){if(l.kind==='ingreso')inc+=l.a;});});
  if(bt>0){
    out+='<div class="tiles"><div class="tile"><span>Presupuestado</span><b>'+money(bt)+'</b></div><div class="tile"><span>Gastado</span><b>'+money(bs)+'</b></div><div class="tile"><span>Disponible</span><b class="'+(bt-bs<0?'over-t':'')+'">'+money(bt-bs)+'</b></div><div class="tile"><span>Ingresos del mes</span><b>'+money(inc)+'</b></div></div>';
    if(inc>0)out+='<p class="note">Con lo presupuestado te quedan '+money(inc-bt)+' del ingreso de este mes para ahorrar o gastos no previstos.</p>';
  }
  var rows=gcats.map(function(c){return {c:c,b:F.budgets[c.name]||0,s:Math.max(0,sp[c.name]||0)};})
    .filter(function(r){return r.b>0||r.s>0;})
    .sort(function(a,b){return (b.b>0)-(a.b>0)||(b.s/(b.b||1))-(a.s/(a.b||1))||b.s-a.s;});
  out+='<section class="sect"><h2>Presupuesto mensual</h2>';
  if(!rows.length)out+='<p class="empty">Aún no hay presupuestos. Pulsa «Sugerir con mi historial» o toca una categoría para fijar su límite.</p>';
  else out+='<ul class="rows">'+rows.map(function(r){
    var pct=r.b>0?Math.min(100,Math.round(r.s/r.b*100)):0,cl=r.b>0?(r.s>r.b?'over':r.s>=r.b*0.8?'warn':''):'';
    var sub=r.b>0?(r.s>r.b?'<b class="over-t">Te pasas '+money(r.s-r.b)+'</b>':'Quedan '+money(r.b-r.s)):'Sin presupuesto';
    return '<li class="crow"><button class="crowbtn" data-act="bud-edit" data-cat="'+esc(r.c.name)+'"><span class="cn">'+esc(r.c.name)+'</span><span class="amt">'+money(r.s)+(r.b>0?' / '+money(r.b):'')+'</span>'+(r.b>0?'<span class="bar '+cl+'"><i style="width:'+Math.max(pct,2)+'%"></i></span>':'')+'<span class="sub" style="grid-column:1/-1;font-size:.85rem;color:var(--muted)">'+sub+'</span></button></li>';
  }).join('')+'</ul>';
  out+='</section>';
  var empty=gcats.filter(function(c){return !(F.budgets[c.name]>0)&&avgSpend(c.name)>0;});
  out+='<div style="display:grid;gap:8px;margin-top:8px">'+
    (empty.length?'<button class="btn primary block" data-act="bud-suggest">Sugerir con mi historial ('+empty.length+' categorías)</button>':'')+
    '<button class="btn block" data-act="bud-pick">Fijar límite de otra categoría</button></div>';
  out+='<p class="note legend">Cuenta solo tu parte de los gastos compartidos. La sugerencia usa tu media de los últimos meses completos, redondeada a 5 €. Solo rellena las categorías que aún no tienen límite. Los gastos no mensuales (seguros, viajes) cuentan en el mes en que se pagan.</p>';
  return out;
}

function movList(){
  var F=S.fin,q=norm(ui.fq||'');
  return allTxns().filter(function(t){
    if(!ui.fall&&t.dv.slice(0,7)!==ui.fmonth)return false;
    if(ui.fday&&t.dv!==ui.fday)return false;
    if(ui.fcat&&!lineItems(t).some(function(l){return l.cat===ui.fcat.cat&&(!ui.fcat.sub||l.sub===ui.fcat.sub);}))return false;
    if(ui.facc&&t.acc!==ui.facc)return false;
    if(q&&norm(t.c+' '+t.m+' '+t.cat+' '+t.sub+' '+(t.n||'')+' '+(t.sp||[]).map(function(l){return l.cat+' '+l.sub;}).join(' ')+' '+(t.p||'')+' '+phonesOf(t).map(function(p){return S.fin.contacts[p]||'';}).join(' ')).indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return a.dv<b.dv?1:a.dv>b.dv?-1:a.i-b.i;});
}

function openSplitSheet(t){

  var init=(t.sp&&t.sp.length?t.sp:[{a:t.a,cat:t.cat,sub:t.sub,sh:t.sh},{a:0,cat:'',sub:''}]);
  var v0={n:String(Math.max(2,init.length))};
  init.forEach(function(l,i){var sl=shToSel(l.sh);v0['a'+i]=l.a?String(Math.abs(l.a)).replace('.',','):'';v0['c'+i]=l.cat?l.cat+'||'+(l.sub||''):'';v0['s'+i]=sl.s;v0['v'+i]=sl.v;});
  function num(x){var n=parseFloat(String(x==null?'':x).replace(',','.'));return isNaN(n)?null:n;}
  openSheet({title:'Dividir movimiento',values:v0,draft:{type:'split',id:t.id},
    note:fmtShort(t.dv)+' · '+money(t.a)+' · '+txTitle(t),
    fieldsFn:function(v){

      var sum=0,blank=0;
      for(var i=0;i<n;i++){var x=num(v['a'+i]);if(x==null)blank++;else sum+=x;}
      for(var j=0;j<n;j++){
        var p=splitCat(v['c'+j]||''),c=catOf(p[0]);
        f.push({type:'head',id:'h'+j,label:'Línea '+(j+1)});
        f.push({id:'a'+j,label:'Importe (€)'+(j===n-1?' — vacío = lo que falte':''),value:v['a'+j],inputmode:'decimal'});
        f.push({id:'c'+j,label:'Categoría',type:'select',value:v['c'+j]||'',re:true,options:[{v:'',t:'Elige categoría…'}].concat(catOptions(false))});

    live:{id:'sum',fn:function(v){return sumText(v,Math.min(8,Math.max(2,+v.n||2)));}},
    onSave:function(v){

      for(var i=0;i<n;i++){

        if(x===0)continue;
        if(!v['c'+i])return 'Elige la categoría de la línea '+(i+1)+'.';
        var p=splitCat(v['c'+i]),sh=selToSh(v['s'+i],v['v'+i]);
        if(sh===undefined)return 'Escribe su parte en la línea '+(i+1)+'.';
        var l={id:uid(),a:sign*x,cat:p[0],sub:p[1]};if(sh)l.sh=sh;lines.push(l);sum+=x;
      }
      if(Math.abs(sum-tot)>0.005)return 'Las líneas suman '+money(sum)+' y el movimiento es de '+money(tot)+'.';
      if(lines.length<2)return 'Para dividir hacen falta al menos dos líneas con importe.';
      t.sp=lines;t.man=true;t.cat='';t.sub='';delete t.sh;
    }});
}

      while(diff(sun,habitStart(h))>=0&&weekSumTo(h,sun)<=h.limit){ws++;sun=addDays(sun,-7);}
      meta='<span>Semana pasada: '+pw+' de '+h.limit+'</span><span>Semanas seguidas dentro del límite: '+ws+'</span>';
    }else{
    if(a){meta='<span>Media 7 días: '+num(a.avg)+' al día</span>';if(b)meta+='<span>Semana anterior: '+num(b.avg)+'</span>';}
    var s2=streak(h);meta+='<span>Racha dentro del límite: '+s2+' '+(s2===1?'día':'días')+'</span>';

function habitWeekLine(h,a,b){

  if(h.type==='reduce')return isWeekly(h)?{txt:tot+' de '+h.limit+' en la semana',v:tot,good:tot<=h.limit,low:true}:{txt:tot+' en total · '+(7-over)+' de 7 días dentro del límite',v:tot,good:over===0,low:true};
  return {txt:n?(n===1?'1 recaída':n+' recaídas'):'Sin recaídas',v:n,good:n===0,low:true};

function spendResid(from,to){
  var lo=addDays(from,-14),hi=addDays(to,14),L=[];
  allTxns().forEach(function(t){if(t.dv<lo||t.dv>hi)return;lineItems(t).forEach(function(l){if(l.kind!=='gasto')return;L.push({d:t.dv,cat:l.cat,v:-l.my});});});
  var by={};L.forEach(function(x){(by[x.cat]=by[x.cat]||[]).push(x);});
  Object.keys(by).forEach(function(c){
    var g=by[c].filter(function(x){return x.v>0.004;}),r=by[c].filter(function(x){return x.v<-0.004;}).sort(function(x,y){return x.d<y.d?-1:1;});
    r.forEach(function(cr){
      g.filter(function(x){return x.v>0.004&&Math.abs(diff(x.d,cr.d))<=14;}).sort(function(p,q){return Math.abs(diff(p.d,cr.d))-Math.abs(diff(q.d,cr.d));}).forEach(function(x){
        if(cr.v>-0.004)return;var m=Math.min(x.v,-cr.v);x.v=r2(x.v-m);cr.v=r2(cr.v+m);});
    });
  });
  return L;
}

  var ch=0;S.chores.forEach(function(c){(c.hist||[]).forEach(function(d){if(d>=a&&d<=b)ch++;});});

  if(S.fin&&(S.fin.txns.length||S.fin.pend.length)){
