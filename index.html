<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Día</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b7a75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Día">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Figtree';font-style:normal;font-weight:300 900;font-display:swap;src:url(figtree.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:200 800;font-display:swap;src:url(bricolage.woff2) format('woff2')}
/* Plan: ficha de bolsillo en azul tinta con un único acento verde azulado.
   Pantalla de una sola columna, barra de pestañas abajo, hojas inferiores para editar. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#e8edf2; --ink:#101a2b; --muted:#566377; --line:#d9e0e8;
  --accent:#0b7a75; --accent-ink:#ffffff; --accent-soft:#d7efed;
  --good:#1b8a4b; --good-soft:#dcf3e5; --warn:#a85f00; --warn-soft:#fcebcb; --bad:#c03636; --bad-soft:#fbdcdc;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1522; --surface:#152030; --surface2:#1d2b3e; --ink:#e8eef6; --muted:#9aa8bb; --line:#26364b;
    --accent:#3dc3b8; --accent-ink:#04201e; --accent-soft:#123a39;
    --good:#4fd18a; --good-soft:#133425; --warn:#f0b24a; --warn-soft:#3a2c10; --bad:#f28080; --bad-soft:#3e1b1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1522; --surface:#152030; --surface2:#1d2b3e; --ink:#e8eef6; --muted:#9aa8bb; --line:#26364b;
  --accent:#3dc3b8; --accent-ink:#04201e; --accent-soft:#123a39;
  --good:#4fd18a; --good-soft:#133425; --warn:#f0b24a; --warn-soft:#3a2c10; --bad:#f28080; --bad-soft:#3e1b1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
.top{padding:calc(env(safe-area-inset-top) + 16px) 16px 4px}
.eyebrow{margin:0;color:var(--muted);font-size:.85rem;font-weight:500}
h1{margin:0;font:700 2rem/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance}
main{flex:1;overflow-y:auto;padding:8px 16px 28px;-webkit-overflow-scrolling:touch}
.sect{margin:20px 0 0}
.sect>h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font:600 .75rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sect>h2 .link{font-size:.8rem;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:600}
.sect>h3{margin:12px 0 4px;font:600 .85rem var(--body);color:var(--muted)}
ul.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rowmain{flex:1;min-width:0;display:grid;gap:1px}
.rowmain .t{overflow-wrap:anywhere}
.row.hl{background:var(--accent-soft);border-radius:10px;box-shadow:0 0 0 6px var(--accent-soft)}
.note-t{font-style:italic}
.newsl{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.4}
.histrow{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.histrow .bar{grid-column:auto}
.qgrp summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;padding:4px 0}
.qgrp ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.qgrp li{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.88rem;border-top:1px solid var(--line);padding-top:6px}
.qgrp li span{min-width:0;overflow-wrap:anywhere}
.qgrp li .link2{white-space:nowrap;flex:none}
.toast{position:sticky;top:0;z-index:5;margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.92rem}
.toast button{background:var(--surface);color:var(--ink);border:0;border-radius:8px;padding:6px 10px;font-weight:600}
.rowmain .t.done{text-decoration:line-through;color:var(--muted)}
.rowmain .sub{font-size:.8rem;color:var(--muted)}
.check{position:relative;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:'';position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.x{flex:none;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:1.2rem;line-height:1;text-align:center}
.pill{flex:none;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.today{background:var(--warn-soft);color:var(--warn)}
.pill.soon{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:.85rem;flex:none}
.btn.block{display:block;width:100%;margin-top:12px}
.empty{margin:0;padding:14px 12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;font-size:.92rem}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);padding:10px 12px;border-radius:12px;margin:8px 0 0;font-size:.88rem}
.habit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px;display:grid;gap:12px}
.habit .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.habit h3{margin:0;font:600 1.05rem/1.25 var(--display)}
.tag{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-top:2px}
.big{width:100%;padding:14px;border-radius:12px;border:2px solid var(--accent);color:var(--accent);font-weight:700;text-align:center}
.big.on{background:var(--accent);color:var(--accent-ink)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);font-size:1.5rem;text-align:center;background:var(--surface2)}
.count{flex:1;text-align:center}
.count b{font:700 2rem/1 var(--display)}
.count span{display:block;font-size:.8rem;color:var(--muted)}
.count.good b{color:var(--good)}
.count.warn b{color:var(--warn)}
.count.bad b{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar.warn i{background:var(--warn)}
.bar.over i{background:var(--bad)}
.over-t{color:var(--bad)}.warn-t{color:var(--warn)}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}
.streak{text-align:center}
.streak b{font:700 2.6rem/1 var(--display);color:var(--accent)}
.streak span{display:block;color:var(--muted);font-size:.85rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted)}
.note{margin:0;font-size:.8rem;color:var(--muted)}
.dots{display:flex;justify-content:space-between}
.dot{display:grid;justify-items:center;gap:3px;font-size:.7rem;color:var(--muted);padding:2px 4px;border-radius:8px;text-align:center}
.dot i{display:block;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.dot.ok i{background:var(--good);border-color:var(--good)}
.dot.bad i{background:var(--bad);border-color:var(--bad)}
.dot.na i{opacity:.35;border-style:dashed}
.dot em{font-style:normal}
.dot.now em{color:var(--ink);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin:6px 0 4px}
.seg button{padding:8px;text-align:center;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.addform{display:grid;gap:8px;margin:10px 0 6px}
.addopts{display:grid;grid-template-columns:1fr auto;gap:8px}
label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:400;font-size:1rem;width:100%;min-width:0}
textarea{min-height:120px;font:400 16px/1.4 ui-monospace,Menlo,monospace}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);font-size:.7rem;font-weight:600;text-align:center}
nav button[aria-current="page"]{color:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:5}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);display:grid;gap:12px;max-height:92%;overflow-y:auto}
.sheet h2{margin:0;font:700 1.25rem var(--display)}
.sheet-actions{display:flex;gap:8px;align-items:center;margin-top:4px}
.sheet-actions .sp{flex:1}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:8px 0 2px}
.datebar .nb{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;text-align:center;line-height:1}
.datebar .dl{text-align:center;font:600 1.05rem var(--display)}
.backnow{margin:4px 0 0}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.mh{font-size:.72rem;color:var(--muted);text-align:center;font-weight:700}
.cell{display:grid;grid-template-rows:auto 1fr;justify-items:center;align-items:center;padding:5px 0 6px;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;text-align:center}
.cell.out{opacity:.45}
.cell.today{border:2px solid var(--accent);font-weight:700}
.cell.sel{background:var(--accent-soft)}
.mk{display:flex;gap:4px;align-items:center}
.mk i{display:block;width:8px;height:8px;border-radius:50%;background:var(--line)}
.mk i.good{background:var(--good)}
.mk i.warn{background:var(--warn)}
.mk i.bad{background:var(--bad)}
.mk i.acc{background:var(--accent)}
.legend{margin:10px 0 0}
.md{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;background:var(--line)}
.md.ok{background:var(--good)}
.md.bad{background:var(--bad)}
.md.pend{background:transparent;border:2px solid var(--line)}
.md.na{opacity:.35}
.mini{display:flex;align-items:center;gap:6px}
.mini .s{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1.2rem;text-align:center;line-height:1}
.mini b{min-width:24px;text-align:center;font-family:var(--display);font-size:1.15rem}
.mini b.bad{color:var(--bad)}
.mini b.warn{color:var(--warn)}
.addform.inline .addopts{margin:0}
nav{grid-template-columns:repeat(6,1fr)}
nav button{font-size:.66rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile span{display:block;font-size:.75rem;color:var(--muted)}
.tile b{font:700 1.25rem var(--display);font-variant-numeric:tabular-nums}
.amt{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.amt.pos{color:var(--good)}
.crow{padding:10px 12px;border-bottom:1px solid var(--line);list-style:none}
.crow:last-child{border-bottom:0}
.crowbtn{display:grid;grid-template-columns:1fr auto;gap:6px 10px;width:100%;align-items:center}
.crowbtn .bar{grid-column:1/-1}
.subs{margin-top:8px;display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.srow{display:flex;justify-content:space-between;gap:10px}
.warnt{color:var(--warn);font-weight:600}
.okt{color:var(--good);font-weight:600}
.resbox{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.9rem;margin-top:8px}
.link2{color:var(--accent);font-weight:600;text-decoration:underline}
label.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
label.chk input{width:auto}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="head"></header>
  <main id="main"></main>
  <nav id="nav" aria-label="Secciones"></nav>
</div>
<div id="sheet" hidden></div>
<script src="xlsx.full.min.js" defer></script>
<script>
(function(){
'use strict';

/* ---------- Fechas ---------- */
var DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DOW=['D','L','M','X','J','V','S'];
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayStr(){return ymd(new Date());}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function utc(s){var p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function diff(a,b){return Math.round((utc(a)-utc(b))/864e5);}
function fmtDate(s){var d=parse(s);var t=DAYS[d.getDay()]+' '+d.getDate()+' de '+MONTHS[d.getMonth()];return t.charAt(0).toUpperCase()+t.slice(1);}
function relDay(s){var n=diff(s,todayStr());if(n===0)return 'hoy';if(n===1)return 'mañana';if(n===-1)return 'ayer';if(n<0)return 'hace '+(-n)+' d';return 'en '+n+' d';}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function num(x){return String(Math.round(x*10)/10).replace('.',',');}

/* ---------- Datos ---------- */
var KEY='mi-dia-v1';
var APP_VERSION='2026.11.18.3';
var CHANGES=[
  {v:'2026.11.18.3',items:['Corregido: si un movimiento pendiente cambiaba de posición entre dos descargas, al importar de nuevo podía duplicarse. Ahora se reconoce por día, importe y texto, y se actualiza su saldo.','Nuevo en Cuentas: «Revisar duplicados» para encontrar y borrar duplicados que ya tengas.']},
  {v:'2026.11.18.2',items:['Metas de ahorro con sobres: tu cuenta de ahorro se reparte entre metas (fondo de emergencia, vivienda, viajes u otras) sin crear movimientos.','Cada mes la app reparte tu ahorro neto según tus porcentajes y te propone ajustes según el tiempo que falta.','Viajes: plan por partidas frente a lo gastado. Los gastos de las fechas del viaje se proponen para que confirmes cuáles son; los pagos de antes se asignan desde el movimiento.','Cada meta tiene su propia lista de tareas.']},
  {v:'2026.11.18',items:['Compartir una lista de compras por WhatsApp o copiarla, con un botón.','Historial de los últimos 12 meses de cualquier categoría o subcategoría, con media, máximo y mínimo. Se abre desde el Resumen o el Presupuesto.','En «Por clasificar» puedes marcar varios movimientos de un grupo y clasificarlos sin crear regla (útil para retiros de cajero).','Este cuadro de novedades, que aparece una vez después de cada actualización. También están en Más.']},
  {v:'2026.11.17.3',items:['Dividir un movimiento en varias líneas con su categoría, sin tocar el del banco.','Gastos compartidos: en tus presupuestos cuenta solo tu parte. Luz, agua y gas al 50 % con un botón; el alquiler como importe fijo con fecha.','Categoría Pareja › Aportación para sus Bizum: no cuentan como ingreso.','Los traspasos entre tus cuentas se emparejan solos y tu ahorro del mes es lo que pasa al ahorro menos lo que vuelve.']},
  {v:'2026.11.17',items:['La app abre al instante, también sin señal.','Notas en los movimientos y búsqueda por nota.','Editar elementos de las listas de compra.','«Por clasificar»: ordenar por monto o cantidad y ver el día de cada movimiento.','Copia de seguridad como archivo.']}
];
var saveFailed=false;
var storageOK=false;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');storageOK=true;}catch(e){}

function blank(){
  return {v:1,demo:false,fin:newFin(),tasks:[],chores:[],habits:[],log:{},lists:[
    {id:uid(),name:'Súper',items:[],freq:{}},
    {id:uid(),name:'Hogar',items:[],freq:{}}
  ]};
}
function seed(){
  var T=todayStr();function d(n){return addDays(T,-n);}
  var log={};function put(date,id,v){(log[date]=log[date]||{})[id]=v;}
  [1,2,4,5,8,9,11].forEach(function(n){put(d(n),'h1',1);});
  [[1,2],[2,3],[3,1],[4,2],[5,1],[6,2],[8,4],[9,3],[10,2]].forEach(function(p){put(d(p[0]),'h2',p[1]);});
  put(d(9),'h3',1);
  return {v:1,demo:true,fin:newFin(),
    tasks:[
      {id:'t1',title:'Revisar la factura de internet',due:T,area:'Hogar',done:false},
      {id:'t2',title:'Reparar el grifo de la cocina',due:'',area:'Hogar',done:false},
      {id:'t3',title:'Pedir hora en la peluquería',due:addDays(T,2),area:'',done:false}
    ],
    chores:[
      {id:'c1',title:'Aspirar el salón',area:'Salón',every:4,last:d(6),hist:[d(10),d(6)].sort()},
      {id:'c2',title:'Limpiar el baño',area:'Baño',every:7,last:d(5),hist:[d(12),d(5)].sort()},
      {id:'c3',title:'Sacar la basura',area:'Cocina',every:2,last:d(2),hist:[d(6),d(4),d(2)].sort()},
      {id:'c4',title:'Cambiar las sábanas',area:'Dormitorio',every:14,last:d(3),hist:[d(3)]},
      {id:'c5',title:'Limpiar la nevera',area:'Cocina',every:30,last:d(31),hist:[d(31)]}
    ],
    lists:[
      {id:'l1',name:'Súper',
        items:[{id:'i1',text:'Huevos',done:false},{id:'i2',text:'Plátanos',done:false},{id:'i3',text:'Arroz',done:true}],
        freq:{'Huevos':3,'Plátanos':2,'Leche':4,'Pan':3}},

/* Lectura e importación del archivo del banco */
function findHeader(rows){
  for(var i=0;i<Math.min(rows.length,40);i++){
    var n=(rows[i]||[]).map(norm);
    if(n.indexOf('importe')>=0&&n.some(function(x){return x==='fecha'||x==='f valor'||x==='fecha valor';}))return i;
  }
  return -1;
}
function readSheet(buf){
  if(!window.XLSX)return {error:'No se pudo cargar el lector de Excel. Comprueba tu conexión y vuelve a intentarlo.'};
  try{
    var wb=XLSX.read(buf,{type:'array'});
    for(var i=0;i<wb.SheetNames.length;i++){
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]],{header:1,raw:true,defval:''});
      if(findHeader(rows)>=0)return {rows:rows};
    }
    return {error:'No encuentro la fila de encabezados (Fecha, Concepto, Importe…). ¿Es el archivo de movimientos del banco?'};
  }catch(e){return {error:'No pude leer el archivo. Prueba con el .xlsx tal como lo descargas del banco.'};}
}
function phoneIn(v){
  var str=String(v==null?'':v),re=/(^|[^\d+])((?:\+|00)?34[\s.-]?)?([67](?:[\s.-]?\d){8})(?![\s.-]?\d)/g,m;
  while((m=re.exec(str))){var d=m[3].replace(/\D/g,'');if(d.length===9)return d;}
  return '';
}
function importRows(rows,accId){
  var hi=findHeader(rows);
  if(hi<0)return {error:'No encuentro la fila de encabezados (Fecha, Concepto, Importe…).'};
  var col={};
  rows[hi].map(norm).forEach(function(h,i){
    if(h==='f valor'||h==='fecha valor')col.dv=i;
    else if(h==='fecha'||h==='fecha operacion'||h==='fecha contable')col.df=i;
    else if(h==='concepto')col.c=i;
    else if(h==='movimiento')col.m=i;
    else if(h==='importe')col.amt=i;
    else if((h==='disponible'||h==='saldo')&&col.bal==null)col.bal=i;
    else if(h==='observaciones')col.obs=i;
  });
  if(col.amt==null||(col.dv==null&&col.df==null))return {error:'Faltan columnas de fecha o importe.'};
  var list=[];
  for(var r=hi+1;r<rows.length;r++){
    var row=rows[r]||[];
    var dv=parseDate(col.dv!=null?row[col.dv]:''),df=parseDate(col.df!=null?row[col.df]:''),a=parseNum(row[col.amt]);
    if(!(dv||df)||a==null)continue;
    var cc=clean(col.c!=null?row[col.c]:''),mm=clean(col.m!=null?row[col.m]:''),ob=col.obs!=null?phoneIn(row[col.obs]):'';
    if(ob&&(cc+' '+mm).indexOf(ob)>=0)ob='';
    list.push({dv:dv||df,df:df||dv,c:cc,m:mm,o:'',p:ob,a:a,b:col.bal!=null?parseNum(row[col.bal]):null});
  }
  if(!list.length)return {error:'No encontré movimientos en el archivo.'};
  if(list[0].df<list[list.length-1].df)list.reverse();
  list.forEach(function(x,i){x.i=i;});
  var links=0,breaks=0;
  for(var k=0;k<list.length-1;k++){
    var x=list[k],y=list[k+1];
    if(x.b!=null&&y.b!=null){links++;if(Math.abs((x.b-x.a)-y.b)>0.005)breaks++;}
  }
  var F=S.fin,seen={},byBal={},pool={},cnt={},used=new Set();
  var fileMax=list.reduce(function(m,x){return x.df>m?x.df:m;},'');
  function mkey(x){return [x.dv,x.a.toFixed(2),norm(x.c),norm(x.m)].join('|');}
  F.txns.forEach(function(t){if(t.acc!==accId)return;seen[t.k]=t;if(t.b!=null)byBal[[t.acc,t.df,t.a.toFixed(2),t.b.toFixed(2)].join('|')]=t;(pool[mkey(t)]=pool[mkey(t)]||[]).push(t);});
  // Emparejar cada fila del archivo con un movimiento ya guardado: primero clave exacta, luego mismo saldo,
  // y si no, mismo día valor + importe + texto (un pendiente que cambió de posición cambia su saldo).
  var matches=list.map(function(x){
    var k=[accId,x.dv,x.df,x.a.toFixed(2),x.b==null?'':x.b.toFixed(2),norm(x.c),norm(x.m)].join('|');
    if(x.b==null){cnt[k]=(cnt[k]||0)+1;k+='#'+cnt[k];}
    x.k=k;
    var ex=seen[k];if(ex&&used.has(ex))ex=null;
    if(!ex&&x.b!=null){ex=byBal[[accId,x.df,x.a.toFixed(2),x.b.toFixed(2)].join('|')];if(ex&&used.has(ex))ex=null;}
    if(!ex){var arr=pool[mkey(x)]||[];ex=arr.filter(function(t){return !used.has(t)&&t.df===x.df;})[0]||arr.filter(function(t){return !used.has(t);})[0]||null;}
    if(ex)used.add(ex);
    return ex;
  });
  var oldest=list[list.length-1],expected=oldest.b!=null?oldest.b-oldest.a:null,gap=false;
  if(expected!=null){
    var prior=F.txns.filter(function(t){return t.acc===accId&&t.df<=oldest.df&&!used.has(t);});
    if(prior.length&&!prior.some(function(t){return t.b!=null&&Math.abs(t.b-expected)<0.005;}))gap=true;
  }
  var added=0,dups=0,filled=0,upd=0,fresh=[];
  list.forEach(function(x,ix){
    var ex=matches[ix];
    if(ex){
      dups++;
      if(x.p&&!ex.p&&phonesOf(ex).indexOf(x.p)<0){ex.p=x.p;filled++;}
      if(fileMax>=(ex.src||'')){if((x.b!=null&&ex.b!==x.b)||ex.df!==x.df)upd++;if(x.b!=null)ex.b=x.b;ex.df=x.df;ex.i=x.i;ex.src=fileMax;}
      return;
    }
    var nt={id:uid(),acc:accId,k:x.k,dv:x.dv,df:x.df,c:x.c,m:x.m,o:x.o,a:x.a,b:x.b,i:x.i,src:fileMax,cat:'',sub:'',man:false};if(x.p)nt.p=x.p;
    added++;fresh.push(nt);
  });
  fresh.forEach(function(t){F.txns.push(t);});
  classifyAll();save();
  var unc=fresh.filter(isUnc).length;
  return {upd:upd,fresh:fresh,phones:list.filter(function(x){return x.p;}).length,obs:col.obs!=null,added:added,dups:dups,filled:filled,links:links,breaks:breaks,gap:gap,unc:unc,from:list.reduce(function(m,x){return x.dv<m?x.dv:m;},list[0].dv),to:list.reduce(function(m,x){return x.dv>m?x.dv:m;},list[0].dv),total:list.length};
}
function importBuffer(buf,accId){
  var rd=readSheet(buf);if(rd.error)return rd;
  return importRows(rd.rows,accId);
}
function ensureAccount(){
  var F=S.fin;
  if(!F.accounts.length)F.accounts.push({id:uid(),name:'Cuenta principal',type:'corriente'});
  var id=ui.impAcc;
  if(!id||!accOf(id))id=F.accounts[0].id;
  return id;
}
function minDate(rows){
  var hi=findHeader(rows),idx=[],m='';
  rows[hi].map(norm).forEach(function(h,i){if(h==='f valor'||h==='fecha'||h==='fecha valor')idx.push(i);});
  for(var r=hi+1;r<rows.length;r++){idx.forEach(function(i){var d=parseDate((rows[r]||[])[i]);if(d&&(!m||d<m))m=d;});}
  return m;
}
function handleFiles(list){
  var files=Array.prototype.slice.call(list||[]);
  if(!files.length)return;
  var accId=ensureAccount(),pending=files.length,loaded=[];
  function done(){
    if(--pending>0)return;
    loaded.forEach(function(x){if(x.rd.rows)x.min=minDate(x.rd.rows);});
    loaded.sort(function(a,b){return (a.min||'9999')<(b.min||'9999')?-1:(a.min||'9999')>(b.min||'9999')?1:0;});
    ui.importResults=loaded.map(function(x){var r=x.rd.error?{error:x.rd.error}:importRows(x.rd.rows,accId);r.file=x.name;return r;});
    var np=pairTransfers();var mo=runMonthly();ui.importResults.forEach(function(r){if(r.fresh){r.unc=r.fresh.filter(isUnc).length;delete r.fresh;}});if(np){classifyAll();save();ui.msg=np+(np===1?' traspaso nuevo emparejado':' traspasos nuevos emparejados')+' entre tus cuentas.';}
    if(mo.some(function(x){return x.tot>0;})){ui.msg=(ui.msg?ui.msg+' ':'')+'Se repartió el ahorro de '+monthName(mo[mo.length-1].m)+' entre tus metas.';}
    ui.fmonth='';render();
  }
  files.forEach(function(file,idx){
    var fr=new FileReader();
    fr.onload=function(){loaded[idx]={name:file.name,rd:readSheet(fr.result)};done();};
    fr.onerror=function(){loaded[idx]={name:file.name,rd:{error:'No pude abrir el archivo.'}};done();};
    fr.readAsArrayBuffer(file);
  });
}

/* Vistas de Finanzas */
function defaultMonth(){
  var mx='';S.fin.txns.forEach(function(t){if(t.dv>mx)mx=t.dv;});
  return (mx||todayStr()).slice(0,7);
}
function monthBar(){
  var d=parse(ui.fmonth+'-01');
  return '<div class="datebar"><button class="nb" data-act="fm-prev" aria-label="Mes anterior">‹</button><span class="dl">'+cap(MONTHS[d.getMonth()])+' '+d.getFullYear()+'</span><button class="nb" data-act="fm-next" aria-label="Mes siguiente">›</button></div>';
}
function txTitle(t){var s=t.c+(t.m&&!isCard(t)?' · '+t.m:'');if(t.p&&s.indexOf(t.p)<0)s+=' · '+t.p;return disp(s);}
function txRow(t){
  var c=t.cat?esc(t.cat+(t.sub?' › '+t.sub:'')):'Sin clasificar';
  if(t.tr){var oa=accOf(t.trAcc);c='Traspaso '+(t.a<0?'a ':'desde ')+esc(oa?oa.name:'otra cuenta');}
  else if(t.sp&&t.sp.length){c='Dividido: '+esc(t.sp.map(function(l){return l.sub||l.cat;}).join(', '));}
  var lh=lineItems(t).reduce(function(m,l){return m+l.her;},0);if(lh>0)c+=' · compartido (tu parte '+money(-(t.a+lh))+')';
  if(t.goal){var tg=goalOf(t.goal);if(tg)c+=' · '+esc(tg.name);}
  return '<li class="row'+(ui.fhl===t.id?' hl':'')+'"><button class="rowmain" data-act="tx-edit" data-id="'+t.id+'"><span class="t">'+esc(txTitle(t))+'</span><span class="sub">'+fmtShort(t.dv)+' · '+esc(accName(t.acc))+' · '+((t.cat||t.tr||(t.sp&&t.sp.length))?c:'<b class="warnt">Sin clasificar</b>')+'</span>'+(t.n?'<span class="sub note-t">'+esc(t.n)+'</span>':'')+'</button><span class="amt '+(t.a<0?'neg':'pos')+'">'+money(t.a)+'</span></li>';
}
function viewFin(){
  var F=S.fin,unc=F.txns.filter(isUnc).length;
  if(!ui.fmonth)ui.fmonth=defaultMonth();
  var tabs=[['resumen','Resumen'],['mov','Movimientos'],['cola','Por clasificar'+(unc?' ('+unc+')':'')],['pres','Presupuesto'],['metas','Metas'],['cuentas','Cuentas'],['cats','Categorías']];
  var out='<div class="chips" style="flex-wrap:wrap;overflow:visible" role="group" aria-label="Finanzas">'+tabs.map(function(t){return '<button class="chip" data-act="ftab" data-t="'+t[0]+'" aria-pressed="'+(ui.ftab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>';
  if(ui.ftab==='hist'&&ui.hist)return viewFinHist();
  if(ui.ftab==='goal'){var gg=goalOf(ui.goal);if(gg)return viewGoal(gg);ui.ftab='metas';}
  if(ui.ftab==='goalsarch')return viewGoalsArch();
  if(ui.ftab==='dups')return viewDups();
  if(ui.ftab==='metas')return out+viewFinMetas();
  if(ui.ftab==='mov')return out+viewFinMov();
  if(ui.ftab==='cola')return out+viewFinCola();
  if(ui.ftab==='pres')return out+viewFinPres();
  if(ui.ftab==='cuentas')return out+viewFinCuentas();
  if(ui.ftab==='cats')return out+viewFinCats();
  return out+viewFinResumen(unc);
}
function monthsBack(end,n){var y=+end.slice(0,4),m=+end.slice(5,7),r=[];for(var i=0;i<n;i++){r.unshift(y+'-'+(m<10?'0':'')+m);m--;if(!m){m=12;y--;}}return r;}
function histData(cat,sub){
  var r={},first='';
  S.fin.txns.forEach(function(t){var ym=t.dv.slice(0,7);if(!first||ym<first)first=ym;
    lineItems(t).forEach(function(l){if(l.cat!==cat||(sub&&l.sub!==sub))return;r[ym]=(r[ym]||0)+(l.kind==='gasto'?-l.my:l.a);});});
  return {by:r,first:first};
}
function shortMonth(ym){var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return M[+ym.slice(5,7)-1]+' '+ym.slice(2,4);}
function r2(n){return Math.round(n*100)/100;}
function ymAdd(ym,k){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+(m<9?'0':'')+(m+1);}
function ymDiff(a,b){return (+a.slice(0,4)*12+ +a.slice(5,7))-(+b.slice(0,4)*12+ +b.slice(5,7));}
function goalsActive(){return (S.fin.goals||[]).filter(function(g){return !g.arch;});}
function goalOf(id){return (S.fin.goals||[]).filter(function(g){return g.id===id;})[0]||null;}
function goalBal(id){var b=0;S.fin.alloc.forEach(function(x){if(x.goal===id)b+=x.amt;});return r2(b);}
function savingsTotal(){
  var accs=S.fin.accounts.filter(function(a){return a.type==='ahorro';}),tot=0,has=false;
  accs.forEach(function(a){var b=accBalance(a);if(b){tot+=b.b;has=true;}});
  if(has)return {v:r2(tot),real:true};
  var v=0;S.fin.txns.forEach(function(t){if(accType(t.acc)!=='corriente')return;lineItems(t).forEach(function(l){if(l.kind==='ahorro')v+=-l.a;});});
  return {v:r2(v),real:false};
}
function allocatedTotal(){var v=0;S.fin.alloc.forEach(function(x){if(x.goal)v+=x.amt;});return r2(v);}
function unassigned(){return r2(savingsTotal().v-allocatedTotal());}
function monthSaving(ym){var v=0;S.fin.txns.forEach(function(t){if(t.dv.slice(0,7)!==ym||accType(t.acc)!=='corriente')return;lineItems(t).forEach(function(l){if(l.kind==='ahorro')v+=-l.a;});});return r2(v);}
function lastDataDay(){var mx='';S.fin.txns.forEach(function(t){if(accType(t.acc)==='corriente'&&t.dv>mx)mx=t.dv;});return mx;}
function monthComplete(m){var mx=lastDataDay();return !!mx&&m<todayStr().slice(0,7)&&mx>=m+'-28';}
function fullMonths(n){
  var mx=lastDataDay(),r=[];if(!mx)return r;
  var first='';S.fin.txns.forEach(function(t){var x=t.dv.slice(0,7);if(!first||x<first)first=x;});
  var m=ymAdd(todayStr().slice(0,7),-1);
  while(m>=first&&!monthComplete(m))m=ymAdd(m,-1);
  for(var i=0;i<n&&m>=first;i++){r.unshift(m);m=ymAdd(m,-1);}
  return r;
}
function avgSaving(){var ms=fullMonths(3);if(!ms.length)return 0;return r2(ms.reduce(function(a,m){return a+monthSaving(m);},0)/ms.length);}
function fixedAvg(){
  var ms=fullMonths(3);if(!ms.length)return 0;var v=0;
  S.fin.txns.forEach(function(t){if(ms.indexOf(t.dv.slice(0,7))<0)return;lineItems(t).forEach(function(l){if(l.kind==='gasto'&&subTipo(catOf(l.cat),l.sub)==='fijo')v+=-l.my;});});
  return r2(v/ms.length);
}
function monthsLeft(g){var cur=todayStr().slice(0,7);return Math.max(1,ymDiff(g.due,cur)+1);}
function goalStatus(g,avg){
  var bal=goalBal(g.id),rem=r2(Math.max(0,g.target-bal)),per=(g.pct||0)/100*avg;
  if(rem<=0)return {cls:'okt',txt:'Objetivo alcanzado'};
  if(g.due){
    var ml=monthsLeft(g),need=r2(rem/ml),proj=bal+per*ml,min=g.min||g.target;
    var st=proj>=g.target-0.5?{cls:'okt',txt:'Va bien'}:proj>=min-0.5?{cls:'warnt',txt:'Va justo'+(g.min?': llegas al mínimo':'')}:{cls:'over-t',txt:'No llega a tiempo con el reparto actual'};
    st.need=need;st.ml=ml;st.proj=r2(proj);return st;
  }
  if(per<=0)return {cls:'warnt',txt:'Sin aportación mensual: sube su porcentaje'};
  var n=Math.ceil(rem/per);return {cls:'',txt:'A tu ritmo llegas hacia '+monthName(ymAdd(todayStr().slice(0,7),n-1)),eta:n};
}
function proposal(){
  var avg=avgSaving(),gs=goalsActive();if(!(avg>0)||!gs.length)return null;
  var res={},used=0,short=[];
  gs.forEach(function(g){res[g.id]=0;if(!g.due)return;var rem=Math.max(0,g.target-goalBal(g.id));if(!rem)return;var p=rem/monthsLeft(g)/avg*100;res[g.id]=p;used+=p;});
  if(used>100){gs.forEach(function(g){if(g.due&&res[g.id]){short.push(g.name);res[g.id]=res[g.id]*100/used;}});used=100;}
  var left=100-used,und=gs.filter(function(g){return !g.due&&g.target-goalBal(g.id)>0;}),w=und.reduce(function(a,g){return a+(g.pct||0);},0);
  und.forEach(function(g){res[g.id]=w>0?left*(g.pct||0)/w:left/und.length;});
  var tot=0,keys=Object.keys(res);keys.forEach(function(k){res[k]=Math.floor(res[k]);tot+=res[k];});
  var cap=und.length?100:Math.round(Math.min(100,used));
  keys.sort(function(a,b){return res[b]-res[a];});var i=0;while(tot<cap&&keys.length){res[keys[i%keys.length]]++;tot++;i++;}
  return {pct:res,avg:avg,short:short};
}
function runMonthly(){
  var F=S.fin,gs=goalsActive();if(!gs.length||!F.goalStart)return [];
  var mx=lastDataDay(),cur=todayStr().slice(0,7),out=[];if(!mx)return out;
  var m=F.allocDone?ymAdd(F.allocDone,1):ymAdd(F.goalStart,1);
  while(m<cur&&monthComplete(m)){
    if(F.noAuto===m){F.allocDone=m;m=ymAdd(m,1);continue;}
    var n=monthSaving(m),tot=0;
    if(n>0)gs.forEach(function(g){var a=r2(n*(g.pct||0)/100);if(a>0){F.alloc.push({id:uid(),goal:g.id,amt:a,date:m+'-28',kind:'auto',m:m});tot+=a;}});
    F.allocDone=m;out.push({m:m,n:n,tot:r2(tot)});m=ymAdd(m,1);
  }
  if(out.length){F.cardM=out[out.length-1].m;save();}
  return out;
}
var TRIP_PLAN=[['Vuelos y transporte',30],['Alojamiento',30],['Comida',15],['Actividades',10],['Transporte local',5],['Compras y otros',0],['Colchón',10]];
var HOME_PLAN=[['Entrada',70],['Gastos de compra',20],['Mudanza y muebles',10]];
function partOf(g,t,l){
  var plan=g.plan||[];if(!plan.length)return '';
  if(t.gpart&&plan.some(function(x){return x.n===t.gpart;}))return t.gpart;
  var c=norm(l.cat),sb=norm(l.sub);
  function f(k){var x=plan.filter(function(p){return norm(p.n).indexOf(k)>=0;})[0];return x?x.n:'';}
  var r='';
  if(sb.indexOf('aloj')>=0)r=f('aloj');
  else if(c==='viajes'&&sb.indexOf('transp')>=0)r=f('vuelo');
  else if(c==='transporte')r=f('transporte local')||f('transp');
  else if(c==='restauracion'||c==='alimentacion')r=f('comida');
  else if(sb.indexOf('activ')>=0||c.indexOf('ocio')>=0)r=f('activ');
  else if(c==='compras')r=f('compra');
  return r||f('otro')||plan.filter(function(p){return norm(p.n).indexOf('colch')<0;}).slice(-1).map(function(p){return p.n;})[0]||'';
}
function tripReal(g){
  var by={},tot=0,list=[];
  S.fin.txns.forEach(function(t){if(t.goal!==g.id)return;list.push(t);lineItems(t).forEach(function(l){if(l.a>=0&&l.kind!=='gasto')return;var v=l.kind==='gasto'?-l.my:-l.a;if(!v)return;var pn=partOf(g,t,l);by[pn]=(by[pn]||0)+v;tot+=v;});});
  return {by:by,tot:r2(tot),list:list};
}
function tripCandidates(g){
  if(!g.start||!g.end)return [];
  return S.fin.txns.filter(function(t){return t.a<0&&!t.tr&&!t.goal&&t.dv>=g.start&&t.dv<=g.end&&(t.gno||[]).indexOf(g.id)<0;})
    .sort(function(a,b){return a.dv<b.dv?-1:1;});
}
function looksRecurring(t){var c=catOf(t.cat);if(!c)return false;if(t.cat==='Vivienda')return true;return subTipo(c,t.sub)==='fijo'||/suscrip/i.test(t.sub);}
function goalCard(g,avg){
  var bal=goalBal(g.id),pct=g.target>0?Math.min(100,Math.round(bal/g.target*100)):0,st=goalStatus(g,avg);
  var tag={emergencia:'Fondo de emergencia',vivienda:'Vivienda',viaje:'Viaje',libre:'Meta'}[g.type]||'Meta';
  return '<li class="crow"><button class="crowbtn" data-act="goal-open" data-id="'+g.id+'"><span class="cn">'+esc(g.name)+' <span class="tag">'+tag+'</span></span><span class="amt">'+money(bal)+' / '+money(g.target)+'</span><span class="bar'+(st.cls==='over-t'?' over':st.cls==='warnt'?' warn':'')+'"><i style="width:'+Math.max(pct,2)+'%"></i></span>'+
    '<span class="sub" style="grid-column:1/-1;font-size:.85rem;color:var(--muted)">'+(g.pct||0)+' % del ahorro'+(g.due?' · hasta '+monthName(g.due):'')+(st.need?' · aparta '+money(st.need)+'/mes':'')+' · <span class="'+st.cls+'">'+esc(st.txt)+'</span></span></button></li>';
}
function viewFinMetas(){
  var F=S.fin,gs=goalsActive(),out='';
  if(!gs.length){

function monthName(ym){var M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return M[+ym.slice(5,7)-1]+' de '+ym.slice(0,4);}
function spendByCat(ym){
  var r={};

function avgSpend(name){
  var months={};S.fin.txns.forEach(function(t){months[t.dv.slice(0,7)]=1;});
  var cur=todayStr().slice(0,7),ms=Object.keys(months).filter(function(m){return m<cur;}).sort().slice(-3);
  if(!ms.length)ms=Object.keys(months).sort().slice(-3);
  if(!ms.length)return 0;
  var tot=0;ms.forEach(function(m){tot+=(spendByCat(m)[name]||0);});
  return Math.max(0,tot/ms.length);
}

function goalFields(f,v){

  f.push({id:'goal',label:'Meta o viaje',type:'select',value:v.goal||'',re:true,options:opts});
  var g=goalOf(v.goal);if(g&&g.plan&&g.plan.length)f.push({id:'gpart',label:'Partida',type:'select',value:v.gpart||'',options:[{v:'',t:'Automática según categoría'}].concat(g.plan.map(function(x){return {v:x.n,t:x.n};}))});
}
function saveGoalFields(t,v){
  if(v.goal==null)return;
  if(v.goal){if(t.goal!==v.goal)t.gno=(t.gno||[]).filter(function(x){return x!==v.goal;});t.goal=v.goal;if(v.gpart)t.gpart=v.gpart;else delete t.gpart;}
  else{if(t.goal)t.gno=(t.gno||[]).concat([t.goal]);delete t.goal;delete t.gpart;}
}
function openSplitSheet(t){
  function sumText(v,n){var sum=0;for(var i=0;i<n;i++){var x=num(v['a'+i]);if(x!=null)sum+=x;}var rest=Math.round((tot-sum)*100)/100;return 'Total '+money(tot)+' · asignado '+money(sum)+' · '+(Math.abs(rest)<0.005?'cuadra.':rest>0?'falta '+money(rest)+'.':'te pasas '+money(-rest)+'.');}
  var sign=t.a<0?-1:1,tot=Math.abs(t.a),ym=t.dv.slice(0,7);
  var init=(t.sp&&t.sp.length?t.sp:[{a:t.a,cat:t.cat,sub:t.sub,sh:t.sh},{a:0,cat:'',sub:''}]);
  var v0={n:String(Math.max(2,init.length))};
  init.forEach(function(l,i){var sl=shToSel(l.sh);v0['a'+i]=l.a?String(Math.abs(l.a)).replace('.',','):'';v0['c'+i]=l.cat?l.cat+'||'+(l.sub||''):'';v0['s'+i]=sl.s;v0['v'+i]=sl.v;});
  function num(x){var n=parseFloat(String(x==null?'':x).replace(',','.'));return isNaN(n)?null:n;}
  openSheet({title:'Dividir movimiento',values:v0,
    note:fmtShort(t.dv)+' · '+money(t.a)+' · '+txTitle(t),
    fieldsFn:function(v){
      var n=Math.min(8,Math.max(2,+v.n||2)),f=[{id:'n',label:'Número de líneas',type:'select',value:String(n),re:true,options:[2,3,4,5,6,7,8].map(function(k){return {v:String(k),t:String(k)};})}];
      var sum=0,blank=0;
      for(var i=0;i<n;i++){var x=num(v['a'+i]);if(x==null)blank++;else sum+=x;}
      for(var j=0;j<n;j++){
        var p=splitCat(v['c'+j]||''),c=catOf(p[0]);
        f.push({type:'head',id:'h'+j,label:'Línea '+(j+1)});
        f.push({id:'a'+j,label:'Importe (€)'+(j===n-1?' — vacío = lo que falte':''),value:v['a'+j],inputmode:'decimal'});
        f.push({id:'c'+j,label:'Categoría',type:'select',value:v['c'+j]||'',re:true,options:[{v:'',t:'Elige categoría…'}].concat(catOptions(false))});
        if(sign<0&&c&&c.kind==='gasto'){
          f.push({id:'s'+j,label:'¿Compartido?',type:'select',value:v['s'+j]||'',re:true,options:shareOpts(shareRuleFor(p[0],p[1],ym))});
          if(v['s'+j]==='pct'||v['s'+j]==='amt')f.push({id:'v'+j,label:v['s'+j]==='pct'?'Su parte (%)':'Su parte (€)',value:v['v'+j],inputmode:'decimal'});
        }
      }
      f.splice(1,0,{type:'info',id:'sum',text:sumText(v,n)});
      return f;},
    live:{id:'sum',fn:function(v){return sumText(v,Math.min(8,Math.max(2,+v.n||2)));}},
    onSave:function(v){
      var n=Math.min(8,Math.max(2,+v.n||2)),lines=[],sum=0;
      for(var i=0;i<n;i++){
        var x=num(v['a'+i]);
        if(x==null&&i===n-1)x=Math.round((tot-sum)*100)/100;
        if(x==null||x<0)return 'Falta el importe de la línea '+(i+1)+'.';
        if(x===0)continue;
        if(!v['c'+i])return 'Elige la categoría de la línea '+(i+1)+'.';
        var p=splitCat(v['c'+i]),sh=selToSh(v['s'+i],v['v'+i]);
        if(sh===undefined)return 'Escribe su parte en la línea '+(i+1)+'.';
        var l={id:uid(),a:sign*x,cat:p[0],sub:p[1]};if(sh)l.sh=sh;lines.push(l);sum+=x;
      }
      if(Math.abs(sum-tot)>0.005)return 'Las líneas suman '+money(sum)+' y el movimiento es de '+money(tot)+'.';
      if(lines.length<2)return 'Para dividir hacen falta al menos dos líneas con importe.';
      t.sp=lines;t.man=true;t.cat='';t.sub='';delete t.sh;
    }});
}

function dotsHtml(h){

  for(var i=6;i>=0;i--){
    var d=addDays(T,-i),cls='na';
    if(diff(d,start)>=0){
      var v=logv(h.id,d);
      if(h.type==='do')cls=v?'ok':'';

    var st=streak(h);

    body='<button class="big'+(v?' on':'')+'" data-act="h-do" data-id="'+h.id+'" aria-pressed="'+(v?'true':'false')+'">'+(v?'Hecho hoy':'Marcar como hecho')+'</button>';
    meta='<span>Esta semana: '+weekCount(h)+' de '+h.target+'</span><span>Racha: '+st+' '+(st===1?'día':'días')+'</span>';
  }else if(h.type==='reduce'){
    var state=v>h.limit?'bad':(v===h.limit&&h.limit>0?'warn':'good');

    tag='Reducir · máximo '+h.limit+' al día';
    body='<div class="counter"><button class="step" data-act="h-minus" data-id="'+h.id+'" aria-label="Restar uno">−</button>'+
      '<div class="count '+state+'"><b>'+v+'</b><span>de '+h.limit+' hoy</span></div>'+
      '<button class="step" data-act="h-plus" data-id="'+h.id+'" aria-label="Sumar uno">+</button></div>'+
      '<div class="bar '+(state==='good'?'':state)+'"><i style="width:'+pct+'%"></i></div>';
    var a=avgRange(h,0,6),b=avgRange(h,7,13);
    if(a){meta='<span>Media 7 días: '+num(a.avg)+' al día</span>';if(b)meta+='<span>Semana anterior: '+num(b.avg)+'</span>';}
    var s2=streak(h);meta+='<span>Racha dentro del límite: '+s2+' '+(s2===1?'día':'días')+'</span>';
  }else{
    var q=quitStats(h),slipToday=v>0;
    tag='Dejar del todo';
    body='<div class="streak"><b>'+q.cur+'</b><span>'+(q.cur===1?'día sin':'días sin')+'</span></div>'+
      (slipToday?'<button class="btn block" data-act="h-unslip" data-id="'+h.id+'">Deshacer la recaída de hoy</button>':
      '<button class="btn block" data-act="h-slip" data-id="'+h.id+'">Registrar una recaída</button>');
    meta='<span>Mejor racha: '+q.best+' '+(q.best===1?'día':'días')+'</span><span>Recaídas: '+q.count+'</span>';
  }
  return '<article class="habit"><div class="hd"><div><h3>'+esc(h.name)+'</h3><span class="tag">'+tag+'</span></div>'+
    '<button class="btn small" data-act="h-edit" data-id="'+h.id+'">Editar</button></div>'+
    body+dotsHtml(h)+'<div class="meta">'+meta+'</div>'+
    (h.type==='quit'?'<p class="note">Una recaída no borra lo avanzado: tu mejor racha queda guardada.</p>':'')+'</article>';
}

function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(txt);
  return new Promise(function(res,rej){try{var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();ok?res():rej();}catch(e){rej(e);}});
}
function shareList(id,all){
  var L=find(S.lists,id);if(!L)return;var txt=listText(L,all);
  function copied(){copyText(txt).then(function(){ui.msg='Lista copiada. Pégala donde quieras.';render();},function(){ui.msg='No se pudo copiar automáticamente.';render();});}
  if(!all&&navigator.share){navigator.share({text:txt}).catch(function(e){if(e&&e.name==='AbortError')return;copied();});return;}
  copied();
}

  out+='<button class="btn primary block" data-act="bk-file">Descargar copia (archivo)</button>';
  out+='<label class="btn block" style="text-align:center;margin-top:8px">Cargar copia desde archivo<input id="bk-in" type="file" accept=".json,application/json,text/plain" hidden></label>';
  out+='<p class="note">Al cargar un archivo, su contenido aparece abajo. Revisa y pulsa «Restaurar» para confirmar. También puedes copiar y pegar el texto.</p>';
  out+='<p class="note">'+(storageOK?'Tus datos se guardan solo en este dispositivo. Si borras los datos del navegador o desinstalas la app, se pierden: descarga una copia cada cierto tiempo y guárdala en un sitio privado.':'Este navegador no permite guardar datos entre visitas. Copia el texto de abajo para conservarlos.')+'</p>';
  out+='<textarea id="bk" aria-label="Copia de seguridad" spellcheck="false">'+esc(ui.bk)+'</textarea>';
  out+='<div class="addopts" style="margin-top:8px"><button class="btn" data-act="bk-make">Generar copia</button><button class="btn" data-act="bk-copy">Copiar</button></div>';
  out+='<button class="btn block" data-act="bk-restore">'+(ui.confirm==='restore'?'Esto reemplaza tus datos. Pulsa otra vez':'Restaurar desde el texto')+'</button></section>';
  out+='<section class="sect"><h2>Empezar de cero</h2><p class="note">Borra los ejemplos y deja las listas vacías.</p>';
  out+='<button class="btn danger block" data-act="reset">'+(ui.confirm==='reset'?'Se borra todo. Pulsa otra vez':'Borrar todo y empezar de cero')+'</button></section>';
  out+='<section class="sect"><h2>Espacio</h2><p class="note">Usas '+(used/1e6).toFixed(2).replace('.',',')+' MB de unos 5 MB disponibles ('+pct+' %).'+(pct>=70?' <b class="warnt">Se está llenando: avísame para pasar a un almacenamiento más grande.</b>':'')+'</p><span class="bar'+(pct>=90?' over':pct>=70?' warn':'')+'"><i style="width:'+Math.max(pct,2)+'%"></i></span></section>';
  out+='<section class="sect"><h2>Novedades</h2><button class="btn block" data-act="news-all">Ver las novedades de cada versión</button></section>';
  out+='<section class="sect"><h2>Acerca de</h2><p class="note">Mi Día, versión '+APP_VERSION+'. Tus datos se guardan solo en este dispositivo. Aquí no hay recordatorios ni notificaciones: la pantalla Hoy muestra el estado cada vez que la abres.</p></section>';
  return out;
}

var VIEWS={hoy:viewHoy,tareas:viewTareas,compras:viewCompras,habitos:viewHabitos,fin:viewFin,mas:viewMas};
var elHead=document.getElementById('head'),elMain=document.getElementById('main'),elNav=document.getElementById('nav'),elSheet=document.getElementById('sheet');

  var top='';

/* ---------- Hoja de edición ---------- */
function fieldHtml(f){
  var id='f-'+f.id;
  if(f.type==='select'){
    var oh='',lastG='';
    f.options.forEach(function(o){
      if((o.g||'')!==lastG){if(lastG)oh+='</optgroup>';if(o.g)oh+='<optgroup label="'+esc(o.g)+'">';lastG=o.g||'';}
      oh+='<option value="'+esc(o.v)+'"'+(String(o.v)===String(f.value)?' selected':'')+'>'+esc(o.t)+'</option>';
    });
    if(lastG)oh+='</optgroup>';
    return '<label for="'+id+'">'+esc(f.label)+'<select id="'+id+'"'+(f.re?' data-re="1"':'')+'>'+oh+'</select></label>';
  }
  if(f.type==='info')return '<p id="'+id+'" class="note'+(f.warn?' warnt':'')+'" style="margin:0" aria-live="polite">'+esc(f.text)+'</p>';
  if(f.type==='button')return '<button type="button" class="btn block'+(f.cls?' '+f.cls:'')+'" data-act="'+f.act+'"'+(f.data?' data-id="'+esc(f.data)+'"':'')+'>'+esc(f.label)+'</button>';
  if(f.type==='head')return '<h3 style="margin:6px 0 0;font-size:.95rem">'+esc(f.label)+'</h3>';
  return '<label for="'+id+'">'+esc(f.label)+'<input id="'+id+'" type="'+(f.type||'text')+'" value="'+esc(f.value==null?'':f.value)+'"'+
    (f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+(f.inputmode?' inputmode="'+f.inputmode+'"':'')+(f.re?' data-re="1"':'')+(f.required?' required':'')+' autocomplete="off"></label>';
}
function renderSheet(){
  var c=ui.sheet;
  if(!c&&news){
    elSheet.hidden=false;
    elSheet.innerHTML='<div class="scrim" data-act="news-ok"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Novedades"><h2>Novedades</h2>'+
      news.map(function(c){return '<h3 style="margin:10px 0 4px;font-size:.95rem">Versión '+esc(c.v)+'</h3><ul class="newsl">'+c.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';}).join('')+
      '<div class="sheet-actions"><span class="sp"></span><button type="button" class="btn primary" data-act="news-ok">Entendido</button></div></div>';
    return;
  }
  if(!c){elSheet.innerHTML='';elSheet.hidden=true;return;}
  elSheet.hidden=false;
  var fields=c.fieldsFn(c.values);

    '<form class="sheet" data-form="sheet" role="dialog" aria-modal="true" aria-label="'+esc(c.title)+'"><h2>'+esc(c.title)+'</h2>'+
    fields.map(fieldHtml).join('')+(c.note?'<p class="note">'+esc(c.note)+'</p>':'')+(c.error?'<p class="note warnt" role="alert"><b>'+esc(c.error)+'</b></p>':'')+
    '<div class="sheet-actions">'+(c.onDelete?'<button type="button" class="btn danger" data-act="sheet-delete">'+(ui.sheetDel?'¿Seguro? Eliminar':'Eliminar')+'</button>':'')+
    '<span class="sp"></span><button type="button" class="btn" data-act="sheet-close">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></form>';

function collect(){

function openSheet(cfg){

function openTaskSheet(t){

    onSave:function(v){t.title=v.title.trim();t.due=v.due;t.area=v.area.trim();},

function openChoreSheet(c){
  var isNew=!c;
  var cur=c||{title:'',area:'',every:7,last:''};
  openSheet({title:isNew?'Nuevo quehacer':'Editar quehacer',values:{title:cur.title,area:cur.area||'',every:cur.every,last:''},
    note:isNew?'Si indicas la última vez, la app calcula cuándo toca de nuevo.':'Para registrar o corregir cuándo lo hiciste, usa Hoy › Día.',
    fieldsFn:function(v){
      var f=[{id:'title',label:'Quehacer',value:v.title,required:true},{id:'area',label:'Zona (opcional)',value:v.area},
        {id:'every',label:'Se repite cada (días)',type:'number',min:1,max:365,value:v.every,required:true}];
      if(isNew)f.push({id:'last',label:'Última vez que se hizo (opcional)',type:'date',value:v.last});
      return f;
    },
    onSave:function(v){

      if(isNew){if(v.last){o.hist=[v.last];o.last=v.last;}S.chores.push(o);}
    },
    onDelete:isNew?null:function(){S.chores=S.chores.filter(function(x){return x!==c;});}});
}
function openHabitSheet(h){
  var isNew=!h;
  var base=h?{name:h.name,type:h.type,target:h.target||4,limit:h.limit==null?2:h.limit,start:h.start||todayStr()}:{name:'',type:'do',target:4,limit:2,start:todayStr()};
  openSheet({title:isNew?'Nuevo hábito':'Editar hábito',values:base,
    fieldsFn:function(v){
      var f=[{id:'name',label:'Nombre',value:v.name,required:true,placeholder:'Ej.: Caminar 30 minutos'}];
      if(isNew)f.push({id:'type',label:'Tipo',type:'select',value:v.type,re:true,options:[{v:'do',t:'Hacer: algo que quiero repetir'},{v:'reduce',t:'Reducir: bajar la cantidad diaria'},{v:'quit',t:'Dejar del todo: contar los días sin'}]});
      if(v.type==='do')f.push({id:'target',label:'Veces por semana',type:'number',min:1,max:7,value:v.target,required:true});
      if(v.type==='reduce')f.push({id:'limit',label:'Máximo por día',type:'number',min:0,max:99,value:v.limit,required:true});
      if(v.type==='quit')f.push({id:'start',label:'Empecé a contar el',type:'date',value:v.start,required:true});
      return f;
    },
    onSave:function(v){
      var type=isNew?v.type:h.type;
      var o=h||{id:uid(),type:type,created:todayStr()};

      if(type==='do')o.target=Math.min(7,Math.max(1,parseInt(v.target,10)||1));
      if(type==='reduce')o.limit=Math.max(0,parseInt(v.limit,10)||0);
      if(type==='quit')o.start=v.start||todayStr();
      if(isNew)S.habits.push(o);
    },
    onDelete:isNew?null:function(){S.habits=S.habits.filter(function(x){return x!==h;});}});
}
function openListSheet(l){
  var isNew=!l;
  var cur=l||{name:''};
  openSheet({title:isNew?'Nueva lista':'Editar lista',values:{name:cur.name},
    fieldsFn:function(v){return [{id:'name',label:'Nombre',value:v.name,required:true}];},
    onSave:function(v){
      var o=l||{id:uid(),items:[],freq:{}};o.name=v.name.trim();
      if(isNew){S.lists.push(o);ui.listId=o.id;}
    },
    onDelete:(isNew||S.lists.length<2)?null:function(){S.lists=S.lists.filter(function(x){return x!==l;});ui.listId=null;}});
}

/* ---------- Acciones ---------- */
function find(arr,id){return arr.filter(function(x){return x.id===id;})[0];}
function openItemSheet(id){
  var L=null,it=null;S.lists.forEach(function(l){var x=find(l.items,id);if(x){L=l;it=x;}});
  if(!it)return;
  openSheet({title:'Editar elemento',values:{text:it.text,list:L.id},
    fieldsFn:function(v){var f=[{id:'text',label:'Texto',value:v.text,required:true}];
      if(S.lists.length>1)f.push({id:'list',label:'Lista',type:'select',value:v.list,options:S.lists.map(function(l){return {v:l.id,t:l.name};})});
      return f;},
    onSave:function(v){
      var t=String(v.text).replace(/\|/g,'/').trim();if(t)it.text=t;
      if(v.list&&v.list!==L.id){var NL=find(S.lists,v.list);if(NL){L.items=L.items.filter(function(x){return x!==it;});NL.items.push(it);}}
    },
    onDelete:function(){L.items=L.items.filter(function(x){return x!==it;});}});
}
function addItem(L,text){
  text=text.replace(/\|/g,'/').trim();if(!text)return;
  L.items.push({id:uid(),text:text,done:false});
  L.freq=L.freq||{};L.freq[text]=(L.freq[text]||0)+1;
}
function habitDayAct(a,id,date){
  var h=find(S.habits,id);if(!h)return;
  var v=logv(id,date),nv;
  if(a==='hd-do'||a==='hd-slip')nv=v?0:1;else if(a==='hd-plus')nv=v+1;else nv=Math.max(0,v-1);
  if(nv>0&&h.type!=='quit'&&diff(date,h.created)<0)h.created=date;
  setLog(id,date,nv);
}
function setChoreHist(c,mutate){
  c.hist=c.hist||[];mutate(c.hist);c.hist.sort();
  c.last=c.hist.length?c.hist[c.hist.length-1]:null;save();
}
function act(a,ds){
  var T=todayStr();
  switch(a){
    case 'tab':ui.tab=ds.tab;ui.confirm='';break;
    case 'go':ui.tab=ds.tab;if(ds.sub)ui.taskTab=ds.sub;ui.confirm='';break;
    case 'subtab':ui.taskTab=ds.sub;break;
    case 'view-set':ui.view=ds.view;break;
    case 'date-prev':case 'date-next':
      var sg=a==='date-prev'?-1:1;
      if(ui.view==='dia')ui.date=addDays(ui.date,sg);else if(ui.view==='semana')ui.date=addDays(ui.date,7*sg);else ui.date=addMonths(ui.date,sg);
      break;
    case 'date-today':ui.date=T;break;
    case 'goto-day':ui.tab='hoy';ui.view='dia';ui.date=ds.date;break;
    case 'hd-do':case 'hd-plus':case 'hd-minus':case 'hd-slip':habitDayAct(a,ds.id,ds.date);break;
    case 'chore-day':
      var cd=find(S.chores,ds.id);
      if(cd)setChoreHist(cd,function(h){var i=h.indexOf(ds.date);if(i>=0)h.splice(i,1);else h.push(ds.date);});
      break;
    case 'task-day':
      var td=find(S.tasks,ds.id);
      if(td){td.done=!td.done;td.doneAt=td.done?ds.date:'';save();}
      break;
    case 'go-list':ui.tab='compras';ui.listId=ds.id;break;
    case 'h-do':setLog(ds.id,T,logv(ds.id,T)?0:1);break;
    case 'h-plus':setLog(ds.id,T,logv(ds.id,T)+1);break;
    case 'h-minus':setLog(ds.id,T,Math.max(0,logv(ds.id,T)-1));break;
    case 'h-slip':setLog(ds.id,T,1);break;
    case 'h-unslip':setLog(ds.id,T,0);break;
    case 'h-edit':openHabitSheet(find(S.habits,ds.id));return;
    case 'h-new':openHabitSheet(null);return;
    case 'chore-done':var c=find(S.chores,ds.id);if(c)setChoreHist(c,function(h){if(h.indexOf(T)<0)h.push(T);});break;
    case 'chore-edit':openChoreSheet(find(S.chores,ds.id));return;
    case 'chore-new':openChoreSheet(null);return;
    case 'task-toggle':var t=find(S.tasks,ds.id);if(t){t.done=!t.done;t.doneAt=t.done?T:'';save();}break;
    case 'task-edit':openTaskSheet(find(S.tasks,ds.id));return;
    case 'list-select':ui.listId=ds.id;break;
    case 'list-new':openListSheet(null);return;
    case 'list-edit':openListSheet(find(S.lists,ds.id));return;
    case 'item-edit':openItemSheet(ds.id);return;
    case 'dup-del':if(ui.confirm!=='dup-'+ds.id){ui.confirm='dup-'+ds.id;break;}deleteTx(ds.id);ui.confirm='';ui.msg='Movimiento borrado.';save();break;
    case 'dup-ok':S.fin.dupOk=(S.fin.dupOk||[]).concat([ds.id]);save();break;
    case 'go-metas':ui.tab='fin';ui.ftab='metas';break;
    case 'goal-open':ui.goal=ds.id;ui.ftab='goal';ui.confirm='';elMain.scrollTop=0;break;
    case 'goal-back':ui.ftab='metas';ui.confirm='';break;
    case 'goal-new-menu':ui.goalMenu=!ui.goalMenu;break;
    case 'goal-new':openGoalSheet(null,ds.t);return;
    case 'goal-edit':openGoalSheet(goalOf(ds.id));return;
    case 'goal-plan':openPlanSheet(goalOf(ds.id));return;
    case 'goal-pcts':openPctSheet();return;
    case 'goal-arch-list':ui.ftab='goalsarch';break;
    case 'goal-unarch':var gu=goalOf(ds.id);if(gu){var others=goalsActive().reduce(function(a,x){return a+(x.pct||0);},0);gu.arch=false;if(others+(gu.pct||0)>100)gu.pct=Math.max(0,100-others);save();}break;
    case 'goal-close':if(ui.confirm!=='goal-close'){ui.confirm='goal-close';break;}var gc=goalOf(ds.id);if(gc){var bl=goalBal(gc.id);if(bl)S.fin.alloc.push({id:uid(),goal:gc.id,amt:-bl,date:todayStr(),kind:'release',note:'a sin asignar'});gc.arch=true;ui.confirm='';ui.ftab='metas';save();}break;
    case 'alloc-move':openMoveSheet(ds.id||'',ds.id?'':null);return;
    case 'alloc-cover':var gs0=goalsActive().filter(function(g){return goalBal(g.id)>0;});openMoveSheet(gs0[0]?gs0[0].id:'','',Math.min(-unassigned(),gs0[0]?goalBal(gs0[0].id):-unassigned()),'cover');return;
    case 'alloc-spread':var un0=unassigned(),gsS=goalsActive().filter(function(g){return g.pct>0;});if(un0>0&&gsS.length){gsS.forEach(function(g){var a=r2(un0*g.pct/100);if(a>0)S.fin.alloc.push({id:uid(),goal:g.id,amt:a,date:todayStr(),kind:'spread'});});ui.msg='Repartido '+money(un0)+' según tus porcentajes.';save();}break;
    case 'alloc-undo':var um=S.fin.cardM;S.fin.alloc=S.fin.alloc.filter(function(x){return !(x.kind==='auto'&&x.m===um);});S.fin.allocDone=ymAdd(um,-1);S.fin.cardSeen=um;S.fin.noAuto=um;ui.msg='Reparto de '+monthName(um)+' deshecho. Puedes repartirlo a mano.';save();break;
    case 'card-ok':S.fin.cardSeen=S.fin.cardM;save();break;
    case 'prop-apply':var pp=proposal();if(pp)goalsActive().forEach(function(g){g.pct=pp.pct[g.id]||0;});S.fin.propSeen=todayStr().slice(0,7);ui.msg='Porcentajes actualizados.';save();break;
    case 'prop-keep':S.fin.propSeen=todayStr().slice(0,7);save();break;
    case 'trip-unassign':var tq=S.fin.txns.filter(function(x){return x.id===ds.id;})[0];if(tq){var gid=tq.goal;delete tq.goal;delete tq.gpart;tq.gno=(tq.gno||[]).concat([gid]);save();}break;
    case 'news-ok':news=null;S.seenV=APP_VERSION;save();renderSheet();return;
    case 'news-all':news=CHANGES.slice();renderSheet();return;
    case 'list-share':shareList(ds.id,ds.all==='1');return;
    case 'hist':var hp=String(ds.id).split('||');closeSheet();ui.hist={cat:hp[0],sub:hp[1]||'',back:ui.ftab==='hist'?(ui.hist&&ui.hist.back)||'resumen':ui.ftab};ui.tab='fin';ui.ftab='hist';elMain.scrollTop=0;break;
    case 'hist-back':ui.ftab=(ui.hist&&ui.hist.back)||'resumen';break;
    case 'hist-month':ui.ftab='mov';ui.fmonth=ds.m;ui.fday='';ui.fq='';ui.fcat={cat:ui.hist.cat,sub:ui.hist.sub};elMain.scrollTop=0;break;
    case 'fcat-clear':ui.fcat=null;break;
    case 'tx-split':var ts=S.fin.txns.filter(function(x){return x.id===ds.id;})[0];if(ts){closeSheet();openSplitSheet(ts);}return;
    case 'tx-unsplit':var tu=S.fin.txns.filter(function(x){return x.id===ds.id;})[0];if(tu){delete tu.sp;tu.man=false;classifyAll();save();closeSheet();render();}return;
    case 'share-reset':if(ui.confirm!=='share-reset'){ui.confirm='share-reset';break;}S.fin.shareFrom=ui.fmonth;ui.confirm='';save();break;
    case 'share-new':openShareSheet(null);return;
    case 'share-edit':openShareSheet((S.fin.shares||[]).filter(function(r){return r.id===ds.id;})[0]);return;
    case 'share-quick':['Luz','Agua','Gas'].forEach(function(sb){if(!S.fin.shares.some(function(r){return r.cat==='Vivienda'&&r.sub===sb;}))S.fin.shares.push({id:uid(),cat:'Vivienda',sub:sb,mode:'pct',v:50,from:''});});save();break;
    case 'item-toggle':case 'item-del':
      S.lists.forEach(function(l){var i=find(l.items,ds.id);if(!i)return;if(a==='item-toggle')i.done=!i.done;else l.items=l.items.filter(function(x){return x!==i;});});save();break;
    case 'freq-add':var L=curList();if(L){addItem(L,ds.text);save();ui.focus='#new-item';}break;
    case 'clear-done':var L2=find(S.lists,ds.id);if(L2){L2.items=L2.items.filter(function(i){return !i.done;});save();}break;
    case 'ftab':ui.tab='fin';ui.ftab=ds.t;ui.fday='';ui.fhl='';ui.fcat=null;break;
    case 'qsort':ui.qsort=ds.s;break;
    case 'fday':ui.tab='fin';ui.ftab='mov';ui.fmonth=ds.d.slice(0,7);ui.fday=ds.d;ui.fq='';ui.facc='';ui.fhl=ds.id||'';elMain.scrollTop=0;render();elMain.scrollTop=0;return;
    case 'fday-clear':ui.fday='';ui.fhl='';break;
    case 'toast-x':ui.msg='';break;
    case 'reload':location.reload();return;
    case 'bk-file':downloadBackup();return;
    case 'fm-prev':ui.fday='';ui.fmonth=addMonths(ui.fmonth+'-01',-1).slice(0,7);break;
    case 'fm-next':ui.fday='';ui.fmonth=addMonths(ui.fmonth+'-01',1).slice(0,7);break;
    case 'bud-edit':openBudSheet(ds.cat);return;
    case 'bud-pick':openBudPick();return;
    case 'bud-suggest':S.fin.cats.forEach(function(c){if(c.kind==='gasto'&&!(S.fin.budgets[c.name]>0)){var a=avgSpend(c.name);if(a>0)S.fin.budgets[c.name]=roundUp5(a);}});save();render();return;
    case 'fexp':ui.fexp[ds.cat]=!ui.fexp[ds.cat];break;
    case 'tx-edit':var tx=find(S.fin.txns,ds.id);if(tx){openTxSheet(tx);}return;
    case 'contact-edit':openContactSheet(ds.ph);return;
    case 'acc-new':openAccSheet(null);return;
    case 'acc-edit':openAccSheet(find(S.fin.accounts,ds.id));return;
    case 'cat-new':openCatSheet(null);return;
    case 'cat-edit':openCatSheet(catOf(ds.cat));return;
    case 'sub-new':openSubSheet(catOf(ds.cat),null);return;
    case 'sub-edit':var cc=catOf(ds.cat);if(cc)openSubSheet(cc,cc.subs.filter(function(x){return x.n===ds.sub;})[0]);return;
    case 'rule-del':S.fin.rules=S.fin.rules.filter(function(r){return r.id!==ds.id;});classifyAll();save();break;
    case 'sheet-close':closeSheet();return;
    case 'sheet-delete':
      if(!ui.sheetDel){ui.sheetDel=true;renderSheet();return;}
      ui.sheet.onDelete();closeSheet();save();break;
    case 'bk-make':ui.bk=JSON.stringify(S);break;
    case 'bk-copy':
      var ta=document.getElementById('bk');
      if(!ta.value){ui.bk=JSON.stringify(S);render();ta=document.getElementById('bk');}
      ta.focus();ta.select();
      try{navigator.clipboard.writeText(ta.value).catch(function(){});}catch(e){}
      return;
    case 'bk-restore':
      if(ui.confirm!=='restore'){ui.confirm='restore';break;}
      try{
        var o=JSON.parse(document.getElementById('bk').value);
        if(!o||o.v!==1||!o.tasks||!o.lists||!o.habits||!o.chores||!o.log)throw new Error('formato');
        if(o.appv&&o.appv>APP_VERSION){ui.confirm='';ui.msg='Esta copia es de una versión más nueva de la app ('+o.appv+'). Actualiza la app antes de restaurarla.';break;}
        S=normalize(o);save();ui.confirm='';ui.bk='';ui.tab='hoy';ui.view='dia';ui.date=T;
      }catch(e){ui.confirm='';ui.bk=document.getElementById('bk').value;alert_('El texto no es una copia válida.');return;}
      break;
    case 'reset':
      if(ui.confirm!=='reset'){ui.confirm='reset';break;}
      S=blank();save();ui.confirm='';ui.listId=null;ui.tab='hoy';ui.view='dia';ui.date=T;break;
  }
  render();
}
function downloadBackup(){
  try{
    var data=JSON.stringify(S),blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='mi-dia-copia-'+todayStr()+'.json';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    ui.msg='Copia descargada. Guárdala en un sitio privado.';
  }catch(e){ui.msg='No se pudo descargar. Usa «Generar copia» y copia el texto.';}
  render();
}
function alert_(msg){
  var el=document.getElementById('bk');
  if(el){el.value=msg;}
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b)return;
  act(b.dataset.act,b.dataset);
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.closest('form');if(!f)return;
  var kind=f.dataset.form;
  if(kind==='sheet'){
    var vals=collect(),res=ui.sheet.onSave(vals);
    if(typeof res==='string'){ui.sheet.values=Object.assign({},ui.sheet.values,vals);ui.sheet.error=res;renderSheet();return;}
    if(ui.sheet&&ui.sheet.keep){ui.sheet.keep=false;save();render();return;}
    closeSheet();save();render();
  }else if(kind==='task-add'){
    var ti=document.getElementById('new-task'),du=document.getElementById('new-task-due');
    if(ti.value.trim()){S.tasks.push({id:uid(),title:ti.value.trim(),due:du.value,area:'',done:false});save();ui.focus='#new-task';render();}
  }else if(kind==='item-add'){
    var L=curList(),it=document.getElementById('new-item');
    if(L&&it.value.trim()){addItem(L,it.value);save();ui.focus='#new-item';render();}
  }else if(kind==='q-apply'){
    var gi=+f.dataset.gi,g=queueGroups()[gi];
    if(g){
      var qt=f.querySelector('[name=text]').value,qv=f.querySelector('[name=cat]').value,qs=f.querySelector('[name=sim]').checked;
      var qm=f.querySelector('[name=mode]');
      if(qm&&qm.value==='sel'&&qv){
        var ids={};[].forEach.call(f.querySelectorAll('[name=sel]:checked'),function(x){ids[x.value]=1;});
        var qp2=splitCat(qv),nsel=0;S.fin.txns.forEach(function(t){if(ids[t.id]){t.man=true;t.cat=qp2[0];t.sub=qp2[1];nsel++;}});
        ui.msg=nsel?nsel+(nsel===1?' movimiento clasificado':' movimientos clasificados')+' sin crear regla.':'No había ningún movimiento marcado.';save();render();
      }else if(qt.trim()&&qv){var qp=splitCat(qv);addRule(qt,qp[0],qp[1],qs?Math.round(median(g.items.map(function(t){return Math.abs(t.a);}))*100)/100:null);render();}
    }
  }else if(kind==='trip-review'){
    var gr=goalOf(f.dataset.id);
    if(gr){var on={},nA=0;[].forEach.call(f.querySelectorAll('[name=sel]'),function(x){on[x.value]=x.checked;});
      S.fin.txns.forEach(function(t){if(!(t.id in on))return;if(on[t.id]){t.goal=gr.id;nA++;}else{t.gno=(t.gno||[]).concat([gr.id]);}});
      ui.msg=nA+(nA===1?' gasto asignado':' gastos asignados')+' a '+gr.name+'.';save();render();}
  }else if(kind==='gtask-add'){
    var gt=goalOf(f.dataset.id),ti2=document.getElementById('new-gtask'),du2=document.getElementById('new-gtask-due');
    if(gt&&ti2.value.trim()){S.tasks.push({id:uid(),title:ti2.value.trim(),due:du2.value,area:gt.name,goal:gt.id,done:false});save();ui.focus='#new-gtask';render();}
  }else if(kind==='task-add-day'){
    var tx=document.getElementById('new-task-day');
    if(tx.value.trim()){S.tasks.push({id:uid(),title:tx.value.trim(),due:f.dataset.date,area:'',done:false});save();ui.focus='#new-task-day';render();}
  }
});
document.addEventListener('input',function(e){
  if(ui.sheet&&ui.sheet.live&&e.target.closest&&e.target.closest('.sheet')){var el=document.getElementById('f-'+ui.sheet.live.id);if(el)el.textContent=ui.sheet.live.fn(Object.assign({},ui.sheet.values,collect()));}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.re&&ui.sheet){ui.sheet.values=Object.assign({},ui.sheet.values,collect());renderSheet();return;}
  if(el.id==='imp-file'){handleFiles(el.files);return;}
  if(el.id==='bk-in'&&el.files&&el.files[0]){var fr=new FileReader();fr.onload=function(){ui.bk=String(fr.result||'');ui.confirm='';ui.msg='Copia cargada abajo. Pulsa «Restaurar desde el texto» para usarla.';render();var t=document.getElementById('bk');if(t)t.scrollIntoView({block:'center'});};fr.readAsText(el.files[0]);return;}
  if(el.id==='imp-acc'){ui.impAcc=el.value;return;}
  if(el.id==='fa'){ui.facc=el.value;render();}
});
document.addEventListener('input',function(e){
  if(e.target.id==='fq'){ui.fq=e.target.value;ui.focus='#fq';render();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet();});

var monthly=runMonthly();if(monthly.length){var mt=monthly.filter(function(x){return x.tot>0;});if(mt.length)ui.msg='Reparto automático de '+monthName(mt[mt.length-1].m)+' hecho: revísalo en Finanzas › Metas.';}
render();
if(news)renderSheet();
})();
</script>
<script>
try{
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    var hadCtrl=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtrl){window.__newVersion=true;if(window.__render)window.__render();}hadCtrl=true;});
    navigator.serviceWorker.register('sw.js').then(function(r){try{r.update();}catch(e){}}).catch(function(){});
  }
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
}catch(e){}
</script>
